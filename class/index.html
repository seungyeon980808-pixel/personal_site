<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>class — 수업 자료실</title>
<meta name="description" content="학습지와 교재를 펼쳐 보고 내려받는 수업 자료실">
<link rel="icon" href="/assets/about/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/assets/about/favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/about/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="psy.ai.kr">
<meta property="og:title" content="수업 자료실 — psy.ai.kr/class">
<meta property="og:description" content="학습지와 교재를 펼쳐 보고 내려받는 수업 자료실">
<meta property="og:url" content="https://www.psy.ai.kr/class/">
<meta property="og:image" content="https://www.psy.ai.kr/class/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.psy.ai.kr/class/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfbfb; --ink:#111113; --muted:#8c8c91; --line:#e6e6ea;
  --sans:"Apple SD Gothic Neo","Pretendard",system-ui,-apple-system,sans-serif;
  --serif:"Noto Serif KR","AppleMyungjo",serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);word-break:keep-all;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}

/* ===== 위 줄 ===== */
.top{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  padding:22px 40px;font-size:13px;background:linear-gradient(var(--bg) 55%,rgba(251,251,251,0))}
.logo{font-family:var(--serif);font-size:18px;font-weight:500;letter-spacing:-.01em;text-decoration:none}
.logo span{color:var(--muted);font-weight:300}
.top nav{display:flex;gap:28px;color:#555}
.top nav a{text-decoration:none}
.top nav a:hover{color:var(--ink)}
.top nav{align-items:center}
.sbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#444;margin-left:-6px}
.sbtn:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.search{position:fixed;top:0;left:0;right:0;z-index:60;background:rgba(251,251,251,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:18px 40px 20px;transform:translateY(-102%);transition:transform .45s var(--ease)}
.search.on{transform:none}
.sbox{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--ink);padding-bottom:10px}
.sbox input{flex:1;border:0;background:none;outline:none;font-family:var(--serif);font-size:26px;font-weight:300;letter-spacing:-.03em;color:var(--ink)}
.sbox input::-webkit-search-cancel-button{display:none}
.sbox button{font-size:13px;color:var(--muted)}
.sres{list-style:none;max-width:760px;margin:6px auto 0;max-height:60vh;overflow:auto}
.sres li{display:flex;gap:16px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.sres li:hover,.sres li.on{background:rgba(0,0,0,.035)}
.sres img{width:34px;height:48px;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.12);flex:none}
.sres .kind{font-size:11px;letter-spacing:.1em;color:var(--muted);flex:none;width:44px;text-align:center}
.sres b{font-weight:600;font-size:14px}
.sres span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.sres .none{cursor:default;color:var(--muted);font-size:14px;padding:18px 4px}
.sres mark{background:none;color:#2f6bff}

/* ===== 전시실 ===== */
.hall{position:relative;height:max(calc(100vh + 140px),900px)}
.headline{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;z-index:6;color:var(--ink);pointer-events:none;width:min(92vw,1100px);transition:opacity .5s}
.headline .over{font-size:12px;letter-spacing:.4em;opacity:.55}
.headline h1{font-family:var(--serif);font-weight:200;font-size:clamp(46px,7.6vw,116px);line-height:1.16;letter-spacing:-.065em;margin-top:30px}
.headline h1 span{display:block}
.headline h1 .l2{padding-left:.9em}
.headline .rule{width:44px;height:1px;background:var(--ink);margin:38px auto 0;opacity:.5}
.notice{pointer-events:auto;display:inline-flex;gap:12px;margin-top:22px;font-size:13px;color:#444;text-decoration:none}
.notice:hover{color:var(--ink)}
.notice b{font-weight:600;opacity:.6;letter-spacing:.12em;font-size:11px;align-self:center}

/* ===== 책 ===== */
.slot{position:absolute;transform:translate(-50%,-50%);z-index:3;transition:opacity .6s,filter .6s}
.slot.open{z-index:30}
.scene{width:var(--W);height:calc(var(--W) * 1.414);perspective:2000px;position:relative;cursor:pointer;outline:none}
.scene:focus-visible{outline:1px solid var(--ink);outline-offset:10px}
.shadow{position:absolute;left:10%;right:-2%;bottom:calc(var(--W) * -.07);height:calc(var(--W) * .11);border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.2),rgba(0,0,0,0));filter:blur(3px);transition:all .7s var(--ease)}
.book{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(4deg) rotateY(-16deg);transition:transform .8s var(--ease)}
.slot:not(.open) .scene:hover .book{transform:rotateX(3deg) rotateY(-9deg) translateY(-6px)}
.hall .slot{transform:translate(-50%,calc(-50% + var(--sy,0px)))}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;
  transform:translate3d(var(--tx,0px),var(--ty,0px),0) rotateX(var(--ry,0deg)) rotateY(var(--rx,0deg))}
.slot.open .book{transform:translateX(calc(var(--W) / 2 + var(--dx,0px))) translateY(var(--dy,0px)) rotateX(8deg) scale(var(--zoom))}
.slot.open .shadow{opacity:0}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bk{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;
  transform:translateZ(calc(var(--T) * -1)) rotateY(0deg) translateZ(0px);transition:transform .65s cubic-bezier(.3,.7,.2,1);transition-delay:0ms}
.slot.open .bk{transform:translateZ(calc(var(--T) * -1)) rotateY(-180deg) translateZ(var(--z2));transition-delay:calc(260ms + var(--L) * 50ms)}
.bk .front{background:#f3f3f5;box-shadow:inset 10px 0 18px -12px rgba(0,0,0,.16)}
.bk .back{transform:rotateY(180deg);background:#fff center/cover no-repeat;border-radius:3px 1px 1px 3px;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 34px 70px -28px rgba(0,0,0,.3)}
.bk .back::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,rgba(0,0,0,.14) 0,rgba(255,255,255,.1) 2.5%,rgba(255,255,255,0) 6%)}
.slot.open .edge,.slot.open .spine{opacity:0;transition:opacity .2s .25s}
.info{position:absolute;left:var(--ix,0px);top:var(--iy,0px);width:260px;z-index:5;
  opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.info.side{transform:translateY(-50%)}
.info.below{transform:translateX(-50%);text-align:center;width:min(320px,calc(100vw - 32px))}
.slot.open .info{opacity:1;visibility:visible;transition:opacity .5s 1s,visibility 0s 1s}
.info .no{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.info h3{font-family:var(--serif);font-weight:500;font-size:24px;letter-spacing:-.04em;line-height:1.3;margin-top:10px}
.info .m{font-size:13px;color:#666;line-height:1.7;margin-top:10px}
.info .m span{color:var(--muted)}
.info .btns{display:flex;gap:8px;margin-top:22px}
.info.below .btns{justify-content:center;margin-top:16px}
.info.below h3{font-size:20px;margin-top:6px}
.info.below .m{margin-top:6px}
.info button{font-size:13px;font-weight:600;padding:11px 20px;border-radius:999px;white-space:nowrap}
.info .pri{background:var(--ink);color:#fff}
.info .sec{box-shadow:inset 0 0 0 1px #c9c9ce;background:#fff}
.info .sec span{font-weight:400;color:var(--muted);margin-left:4px}
.edge{position:absolute;top:2px;bottom:2px;left:100%;width:var(--T);transform-origin:left;transform:rotateY(90deg);
  background:repeating-linear-gradient(90deg,#fdfdfd 0 1px,#e2e2e6 1px 2px)}
.spine{position:absolute;top:0;bottom:0;left:0;width:var(--T);transform-origin:left;transform:rotateY(90deg);background:#e9e9ec}
.leaf{position:absolute;inset:1px 2px 1px 0;transform-origin:left center;transform-style:preserve-3d;
  transform:translateZ(var(--z)) rotateY(0deg) translateZ(0px);transition:transform .5s cubic-bezier(.35,.6,.2,1);transition-delay:calc(80ms + var(--i) * 22ms)}
.slot.open .leaf{transform:translateZ(var(--z)) rotateY(var(--a)) translateZ(var(--z2));transition-delay:calc(200ms + (var(--L) - 1 - var(--i)) * 50ms)}
.leaf .face{background:#fff center/cover no-repeat}
.leaf .front{box-shadow:inset 8px 0 14px -10px rgba(0,0,0,.18)}
.leaf .back{transform:rotateY(180deg);box-shadow:inset -8px 0 14px -10px rgba(0,0,0,.18)}
.cover{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transform:translateZ(0) rotateY(0deg) translateZ(0px);
  transition:transform .6s cubic-bezier(.3,.7,.2,1);transition-delay:calc(80ms + var(--L) * 22ms)}
.slot.open .cover{transform:translateZ(0) rotateY(-180deg) translateZ(var(--T));transition-delay:0ms}
.cover .front{border-radius:1px 3px 3px 1px;background:#fff center/cover no-repeat;box-shadow:0 0 0 .5px rgba(0,0,0,.08)}
.cover .front::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.14) 0,rgba(255,255,255,.1) 2.5%,rgba(255,255,255,0) 6%),linear-gradient(120deg,rgba(255,255,255,.18),rgba(255,255,255,0) 40%)}
.cover .back{transform:rotateY(180deg);background:#f1f1f3}

.cap{position:absolute;left:0;top:calc(100% + min(var(--W) * .14, 26px));width:max(100%,170px);font-size:11px;line-height:1.6;color:#666;transition:opacity .4s}
.cap .no{color:var(--muted);letter-spacing:.1em;font-size:10px}
.cap b{display:block;font-weight:600;color:var(--ink);font-size:12.5px;margin:1px 0}
.new{display:inline-block;width:5px;height:5px;border-radius:50%;background:#2f6bff;margin-left:6px;vertical-align:middle}
.slot.open .cap{opacity:0}
body.has-open .slot:not(.open){opacity:.15;filter:grayscale(.4)}
body.has-open .headline{opacity:.12}

/* ===== 소장 목록 ===== */
.board{max-width:1180px;margin:0 auto;padding:60px 40px 0}
.board .count{font-size:13px;color:var(--muted)}
.nlist{list-style:none;margin-top:28px}
.nlist li{display:grid;grid-template-columns:120px 1fr;gap:24px;padding:22px 0;border-bottom:1px solid var(--line)}
.nlist time{font-size:12px;letter-spacing:.08em;color:var(--muted);padding-top:3px}
.nlist b{display:block;font-family:var(--serif);font-weight:500;font-size:19px;letter-spacing:-.03em}
.nlist p{font-size:14px;color:#555;line-height:1.75;margin-top:6px}
.wall{max-width:1180px;margin:0 auto;padding:110px 40px 160px}
.wall-head{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--ink);padding-top:18px;gap:16px}
.wall-head h2{font-family:var(--serif);font-weight:300;font-size:30px;letter-spacing:-.04em}
.filters{display:flex;gap:22px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.filters button.on{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0 24px;margin-top:80px}
.cell{position:relative;--W:150px;height:calc(var(--W) * 1.414 + 160px)}
.cell .slot{left:50%;top:calc(var(--W) * .707)}
.cell:nth-child(4n+2){margin-top:90px}.cell:nth-child(4n+3){margin-top:30px}.cell:nth-child(4n+4){margin-top:140px}
.cell.hide{display:none}
footer{max-width:1180px;margin:0 auto;padding:28px 40px 56px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
footer a{text-decoration:none}

/* ===== 넘겨 보기 ===== */
.viewer{position:fixed;inset:0;z-index:100;display:none}
.viewer.on{display:block}
.viewer .dim{position:absolute;inset:0;background:#f5f5f7;opacity:0;transition:opacity .45s}
.viewer.show .dim{opacity:1}
.viewer .stage{position:absolute;left:50%;top:50%;perspective:2600px;transform-origin:0 0}
.viewer .spread{position:absolute;inset:0;display:flex;transition:transform .75s cubic-bezier(.45,.05,.25,1)}
.viewer .pg{flex:1;position:relative;background:#fff center/contain no-repeat}
.viewer .pg.l{box-shadow:inset -18px 0 24px -20px rgba(0,0,0,.25),0 30px 60px -24px rgba(0,0,0,.22)}
.viewer .pg.r{box-shadow:inset 18px 0 24px -20px rgba(0,0,0,.25),0 30px 60px -24px rgba(0,0,0,.22)}
.viewer .pg.empty{background:transparent;box-shadow:none}
.viewer.single .pg.l{display:none}
.turn{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;z-index:5}
.turn .face{background:#fff center/contain no-repeat}
.turn .back{transform:rotateY(180deg)}
.viewer.single .turn{width:100%}
.vbar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:22px;padding:22px;font-size:13px;color:#555;opacity:0;transition:opacity .4s .3s}
.vtop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:20px 28px;font-size:13px;opacity:0;transition:opacity .4s .3s}
.viewer.show .vbar,.viewer.show .vtop{opacity:1}
.vtop .t{font-family:var(--serif);font-weight:500;font-size:16px;letter-spacing:-.03em}
.vbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--ink)}
.vbtn:hover{background:rgba(0,0,0,.05)}
.vbtn:disabled{opacity:.25;cursor:default}
.pill{font-size:13px;font-weight:600;padding:10px 18px;border-radius:999px;background:var(--ink);color:#fff}
.num{min-width:76px;text-align:center;font-variant-numeric:tabular-nums}

/* ===== 알림 ===== */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:200;background:var(--ink);color:#fff;font-size:13px;
  padding:12px 18px;border-radius:12px;opacity:0;transition:all .35s var(--ease);pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .top{padding:16px}
  .top nav{gap:16px}
  .search{padding:12px 16px 14px}
  .sbox input{font-size:20px}
  .hall{height:max(calc(100svh + 120px),780px)}
  .headline{top:40%}
  .headline h1{font-size:clamp(36px,11vw,48px);margin-top:22px}
  .headline h1 .l2{padding-left:.6em}
  .wall{padding:80px 16px 120px}
  .board{padding:40px 16px 0}
  #noticeTop{display:none}
  .nlist li{grid-template-columns:1fr;gap:6px}
  .wall-head{flex-direction:column;gap:14px}
  .grid{grid-template-columns:repeat(2,1fr);margin-top:48px}
  .cell{--W:118px}
  .cell:nth-child(n){margin-top:0}.cell:nth-child(2n){margin-top:70px}
  footer{padding:24px 16px 48px}
  .vtop{padding:14px 16px}
  .vbar{gap:10px;padding:16px}
}
@media (prefers-reduced-motion:reduce){.book,.leaf,.cover,.shadow,.viewer .stage,.turn{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="./">psy.ai.kr<span>/class</span></a>
  <nav><a href="#notices">공지</a><a href="#wall">소장 목록</a><a href="../">psy.ai.kr</a>
    <button class="sbtn" id="sOpen" aria-label="검색" title="검색 (/)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button></nav>
</header>
<div class="search" id="search" role="dialog" aria-label="검색">
  <div class="sbox"><input id="sInput" type="search" placeholder="학습지·교재·공지 찾기" autocomplete="off"><button id="sClose" aria-label="검색 닫기">닫기</button></div>
  <ul class="sres" id="sRes"></ul>
</div>

<section class="hall" id="hall">
  <div class="headline">
    <div class="over">수업 자료실</div>
    <h1><span>교사가 한가해야,</span><span class="l2">교육이 성장한다.</span></h1>
    <div class="rule"></div>
    <div id="noticeTop"></div>
  </div>
</section>

<section class="board" id="notices">
  <div class="wall-head"><h2>공지</h2><span class="count" id="noticeCount"></span></div>
  <ol class="nlist" id="noticeList"></ol>
</section>

<section class="wall" id="wall">
  <div class="wall-head">
    <h2>소장 목록</h2>
    <div class="filters" id="filters"></div>
  </div>
  <div class="grid" id="grid"></div>
</section>
<footer><span>psy.ai.kr/class</span><a href="../">← psy.ai.kr</a></footer>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="넘겨 보기">
  <div class="dim"></div>
  <div class="vtop"><span class="t" id="vTitle"></span><button class="vbtn" id="vClose" aria-label="닫기">✕</button></div>
  <div class="stage" id="stage"><div class="spread"><div class="pg l" id="pgL"></div><div class="pg r" id="pgR"></div></div></div>
  <div class="vbar">
    <button class="vbtn" id="vPrev" aria-label="앞 쪽">‹</button>
    <span class="num" id="vNum"></span>
    <button class="vbtn" id="vNext" aria-label="다음 쪽">›</button>
    <button class="pill" id="vDown">내려받기</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const narrowQ=()=>innerWidth<=760;
const hover=matchMedia('(hover:hover)').matches;
const fmtDate=d=>{const [y,m,dd]=d.split('-');return `${y}. ${+m}. ${+dd}.`};
const pageImg=(b,n,small)=>`books/${b.slug}/${small?'t':'p'}${pad(n)}.jpg`;
let BOOKS=[];

function toast(msg,ms=2600){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),ms)}

/* ----- 책 한 권 ----- */
function bookHTML(b,W,cap=true){
  const T=Math.max(8,Math.round(W*.06)), L=Math.min(12,Math.floor((b.pages-1)/2)), small=W<=260;
  let leaves='';
  for(let j=0;j<L;j++){
    // 맨 위 낱장이 2쪽, 맨 아래(마지막에 넘어가는) 낱장 뒷면이 뒷표지 바로 앞 쪽
    const p=L>1?2+Math.round((L-1-j)/(L-1)*Math.max(0,b.pages-4)):Math.max(2,b.pages-2);
    // 넘긴 뒤에는 나중에 넘긴 장이 위에 오도록 z를 뒤집는다(--z2)
    leaves+=`<div class="leaf" style="--i:${j};--z:${(-T*(L-j)/(L+1)).toFixed(2)}px;--z2:${(T*(2*j+1-L)/(L+1)).toFixed(2)}px;--a:${-(179.6-j*.02).toFixed(2)}deg">
      <div class="face front" style="background-image:url(${pageImg(b,p,small)})"></div>
      <div class="face back" style="background-image:url(${pageImg(b,Math.min(p+1,b.pages),small)})"></div></div>`;
  }
  const isNew=(Date.now()-new Date(b.date))/864e5<14;
  return `<div class="slot" data-slug="${b.slug}" style="--W:${W}px;--T:${T}px;--L:${L};--zoom:${Math.min(1.7,250/W).toFixed(2)}">
    <div class="scene" tabindex="0" role="button" aria-label="${esc(b.title)} 펼치기">
      <div class="shadow"></div>
      <div class="tilt"><div class="book">
        <div class="bk" style="--z2:${-(T+1)}px"><div class="face front"></div><div class="face back" style="background-image:url(${pageImg(b,b.pages,small)})"></div></div>
        <div class="edge"></div><div class="spine"></div>
        ${leaves}
        <div class="cover"><div class="face front" style="background-image:url(${pageImg(b,1)})"></div><div class="face back"></div></div>
      </div></div>
    </div>
    <div class="info"><div class="no">No. ${pad(b.no)} · ${esc(b.kind)}</div><h3>${esc(b.title)}</h3>
      <div class="m">${esc(b.sub)}<br><span>${b.pages}쪽 · ${(b.size/1e6).toFixed(1)}MB · ${fmtDate(b.date)}</span></div>
      <div class="btns"><button class="pri" data-act="view">넘겨 보기</button><button class="sec" data-act="down">내려받기</button></div></div>
    ${cap?`<div class="cap"><span class="no">No. ${pad(b.no)}</span><b>${esc(b.title)}${isNew?'<span class="new" title="새 자료"></span>':''}</b>${esc(b.kind)}, ${fmtDate(b.date)}</div>`:''}
  </div>`;
}

/* ----- 펼치기 ----- */
function setOpen(slot,on){
  if(on){
    document.querySelectorAll('.slot.open').forEach(s=>s!==slot&&s.classList.remove('open'));
    slot.style.setProperty('--dx','0px');slot.style.setProperty('--dy','0px');
    const r=slot.querySelector('.scene').getBoundingClientRect(), W=r.width, H=r.height;
    const c=r.left+W/2, cy=r.top+H/2, narrow=narrowQ(), info=slot.querySelector('.info');
    const IW=260, GAP=56; // 넓은 화면: 펼친 책 오른쪽에 떨어진 라벨
    let z,spine,top,bottom;
    if(!narrow){
      z=Math.min(1.7,(innerHeight-230)/(1.414*W),(innerWidth-IW-GAP-120)/(2*W));
      const half=W*z, groupL=(innerWidth-(half+GAP+IW))/2;
      spine=W>260?groupL+half:Math.min(Math.max(c,half+16),innerWidth-GAP-IW-16);
      top=84; bottom=innerHeight-40;
    }else{
      z=Math.min(1.7,(innerHeight-330)/(1.414*W),(innerWidth-64)/W);
      spine=innerWidth/2+W*z/2; top=72; bottom=innerHeight-210;
    }
    slot.style.setProperty('--zoom',z.toFixed(3));
    slot.style.setProperty('--dx',(spine-c-W/2+W*z/2)+'px');
    const hh=H*z/2, dy=Math.max(0,top+hh-cy)-Math.max(0,cy+hh-bottom);
    slot.style.setProperty('--dy',dy+'px');
    info.classList.toggle('side',!narrow); info.classList.toggle('below',narrow);
    slot.style.setProperty('--ix',(narrow?innerWidth/2:spine+GAP)-r.left+'px');
    slot.style.setProperty('--iy',(narrow?cy+dy+hh+22:cy+dy)-r.top+'px');
  }
  slot.classList.toggle('open',on);
  document.body.classList.toggle('has-open',!!document.querySelector('.slot.open'));
}
function bind(root){
  root.querySelectorAll('.slot').forEach(slot=>{
    if(slot.dataset.b) return; slot.dataset.b=1;
    const b=BOOKS.find(x=>x.slug===slot.dataset.slug), sc=slot.querySelector('.scene');
    sc.addEventListener('click',()=>setOpen(slot,!slot.classList.contains('open')));
    slot.querySelector('.info').addEventListener('click',e=>{
      const act=e.target.closest('[data-act]'); if(!act) return;
      act.dataset.act==='view'?openViewer(b,sc):download(b);
    });
    sc.addEventListener('keydown',e=>{
      if(e.target!==sc) return;
      if(e.key==='Enter'||e.key===' '){e.preventDefault();setOpen(slot,!slot.classList.contains('open'))}
      if(e.key==='Escape')setOpen(slot,false);
    });
  });
}
document.addEventListener('click',e=>{if(!e.target.closest('.scene')&&!e.target.closest('.info')&&!e.target.closest('.viewer'))document.querySelectorAll('.slot.open').forEach(s=>setOpen(s,false))});

/* ----- 전시실 배치 ----- */
// 첫 책은 크게 글자 뒤에, 나머지는 둘레에 작게. 너비 0이면 화면에 맞춰 크게
const WIDE=[[71,69,0],[13,30,138],[88,24,120],[10,80,110],[90,78,116],[30,12,96]];
const NARROW=[[58,56,0],[18,14,80],[84,90,84]];
const bigW=()=>Math.round(narrowQ()?Math.min(innerWidth*.58,innerHeight*.34):Math.min(innerHeight*.58/1.414,innerWidth*.26));
function layoutHall(){
  // 위치는 첫 화면(창 높이) 기준. 큰 책은 윗변이 문구 가운데쯤에서 시작한다
  const hall=$('hall'), narrow=narrowQ(), V=Math.max(innerHeight,640);
  hall.querySelectorAll('.slot').forEach(s=>s.remove());
  hall.querySelector('.headline').style.top=(narrow?.38:.42)*V+'px';
  const spots=narrow?NARROW:WIDE;
  let need=V;
  BOOKS.slice(0,spots.length).forEach((b,n)=>{
    const [x,y,w]=spots[n], W=w||bigW(), H=W*1.414;
    const cy=w?y/100*V:(narrow?.40:.40)*V+H/2;
    hall.insertAdjacentHTML('beforeend',bookHTML(b,W,!narrow||n===0));
    const s=hall.lastElementChild; s.style.left=x+'%'; s.style.top=cy+'px';
    need=Math.max(need,cy+H/2+110+innerHeight*.1+40); // 책 아래 라벨 + 스크롤 시차 여유
  });
  hall.style.height=need+'px';
  bind(hall);
}
function layoutWall(){
  const kinds=['전체',...new Set(BOOKS.map(b=>b.kind))];
  $('filters').innerHTML=kinds.map((k,i)=>`<button class="${i?'':'on'}" data-k="${esc(k)}">${esc(k)}${i?'':' '+BOOKS.length}</button>`).join('');
  $('grid').innerHTML=BOOKS.map(b=>`<div class="cell" data-k="${esc(b.kind)}">${bookHTML(b,narrowQ()?118:150)}</div>`).join('');
  bind($('grid'));
  $('filters').onclick=e=>{const k=e.target.closest('button')?.dataset.k; if(!k) return;
    $('filters').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.k===k));
    $('grid').querySelectorAll('.cell').forEach(c=>c.classList.toggle('hide',k!=='전체'&&c.dataset.k!==k));};
}

/* ----- 넘겨 보기 ----- */
const V={b:null,s:0,busy:false};
function spreadsOf(b){ // 넓은 화면: [빈,1] [2,3] [4,5] ... / 좁은 화면: 한 쪽씩
  if(V.single) return b.pages;
  return 1+Math.ceil((b.pages-1)/2);
}
function pagesAt(s){
  if(V.single) return [null,s+1];
  if(s===0) return [null,1];
  const l=s*2, r=l+1; return [l, r<=V.b.pages?r:null];
}
const setPg=(el,n)=>{el.classList.toggle('empty',!n);el.style.backgroundImage=n?`url(${pageImg(V.b,n)})`:'none'};
const shiftOf=s=>{if(V.single)return 0; const [l,r]=pagesAt(s); return !l&&r?-25:(l&&!r?25:0)};
const setShift=s=>{$('stage').querySelector('.spread').style.transform=`translateX(${shiftOf(s)}%)`};
function renderSpread(){
  const [l,r]=pagesAt(V.s); setPg($('pgL'),l); setPg($('pgR'),r); setShift(V.s);
  const tot=spreadsOf(V.b);
  $('vNum').textContent=V.single?`${V.s+1} / ${V.b.pages}`:(l&&r?`${l}–${r}`:`${l||r}`)+` / ${V.b.pages}`;
  $('vPrev').disabled=V.s===0; $('vNext').disabled=V.s>=tot-1;
  [V.s-1,V.s+1,V.s+2].forEach(k=>{if(k<0||k>=tot) return; pagesAt(k).forEach(n=>{if(n){const i=new Image();i.src=pageImg(V.b,n)}})});
}
function stageBox(){
  const vw=innerWidth, vh=innerHeight, ratio=1.414, pages=V.single?1:2;
  const maxH=vh-(V.single?150:170), maxW=vw-(V.single?32:120);
  let h=Math.min(maxH,maxW/pages*ratio), w=h/ratio*pages;
  return {w,h};
}
function placeStage(){const {w,h}=stageBox(), st=$('stage'); st.style.width=w+'px'; st.style.height=h+'px'; st.style.marginLeft=-w/2+'px'; st.style.marginTop=-h/2-8+'px'}
function openViewer(b,fromEl){
  V.b=b; V.s=0; V.single=narrowQ(); V.busy=false;
  const sp=$('stage').querySelector('.spread'); sp.style.transition='none'; requestAnimationFrame(()=>requestAnimationFrame(()=>sp.style.transition=''));
  const v=$('viewer'); v.classList.toggle('single',V.single); $('vTitle').textContent=b.title;
  renderSpread(); placeStage(); v.classList.add('on');
  // 책 자리에서 커지기
  const st=$('stage'), to=st.getBoundingClientRect(), from=fromEl.getBoundingClientRect();
  // 앞표지는 가운데(넓은 화면: 무대 왼쪽에서 1/4 지점)에 있다
  const cw=V.single?to.width:to.width/2, cx=V.single?0:to.width/4;
  const sx=from.width/cw, sy=from.height/to.height;
  st.style.transition='none';
  st.style.transform=`translate(${from.left-to.left-sx*cx}px,${from.top-to.top}px) scale(${sx},${sy})`;
  st.getBoundingClientRect();
  st.style.transition='transform .75s cubic-bezier(.2,.8,.2,1)';
  requestAnimationFrame(()=>{v.classList.add('show'); st.style.transform='none'});
  document.querySelectorAll('.slot.open').forEach(s=>setOpen(s,false));
  $('vClose').focus({preventScroll:true});
}
function closeViewer(){
  const v=$('viewer'); v.classList.remove('show');
  $('stage').style.transform='scale(.96)'; $('stage').style.opacity='0'; $('stage').style.transition='all .35s ease';
  setTimeout(()=>{v.classList.remove('on'); $('stage').style.opacity=''; $('stage').style.transform='';},360);
}
function turn(dir){
  const tot=spreadsOf(V.b), ns=V.s+dir;
  if(V.busy||ns<0||ns>=tot) return;
  V.busy=true;
  const [l0,r0]=pagesAt(V.s), [l1,r1]=pagesAt(ns), spread=$('stage').querySelector('.spread');
  const t=document.createElement('div'); t.className='turn';
  setShift(ns); // 넘기면서 펼친 두 쪽이 가운데로 미끄러짐
  const img=n=>n?`background-image:url(${pageImg(V.b,n)})`:'background:transparent';
  if(V.single){
    t.style.left='0'; t.style.transformOrigin='left center';
    t.innerHTML=`<div class="face front" style="${img(dir>0?r0:r1)}"></div>`;
    if(dir>0){ setPg($('pgR'),r1); } else { t.style.transform='rotateY(-100deg)'; }
    spread.appendChild(t); t.getBoundingClientRect();
    t.style.transition='transform .6s cubic-bezier(.45,.05,.25,1),opacity .6s';
    t.style.transform=dir>0?'rotateY(-100deg)':'rotateY(0deg)';
    if(dir>0) t.style.opacity='0';
  }else if(dir>0){
    t.style.left='50%'; t.style.transformOrigin='left center';
    t.innerHTML=`<div class="face front" style="${img(r0)}"></div><div class="face back" style="${img(l1)}"></div>`;
    setPg($('pgR'),r1); spread.appendChild(t); t.getBoundingClientRect();
    t.style.transition='transform .75s cubic-bezier(.45,.05,.25,1)'; t.style.transform='rotateY(-180deg)';
  }else{
    t.style.left='0'; t.style.transformOrigin='right center';
    t.innerHTML=`<div class="face front" style="${img(l0)}"></div><div class="face back" style="${img(r1)}"></div>`;
    setPg($('pgL'),l1); spread.appendChild(t); t.getBoundingClientRect();
    t.style.transition='transform .75s cubic-bezier(.45,.05,.25,1)'; t.style.transform='rotateY(180deg)';
  }
  const done=()=>{V.s=ns; renderSpread(); t.remove(); V.busy=false};
  const ms=matchMedia('(prefers-reduced-motion:reduce)').matches?0:(V.single?600:750);
  setTimeout(done,ms+20);
}
$('vNext').onclick=()=>turn(1); $('vPrev').onclick=()=>turn(-1); $('vClose').onclick=closeViewer;
$('vDown').onclick=()=>download(V.b);
$('stage').addEventListener('click',e=>{const r=$('stage').getBoundingClientRect(); turn(e.clientX>r.left+r.width/2?1:-1)});
addEventListener('keydown',e=>{
  if(!$('viewer').classList.contains('on')){ if(e.key==='Escape')document.querySelectorAll('.slot.open').forEach(s=>setOpen(s,false)); return }
  if(e.key==='ArrowRight')turn(1); if(e.key==='ArrowLeft')turn(-1); if(e.key==='Escape')closeViewer();
});
let tx=null;
$('viewer').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('viewer').addEventListener('touchend',e=>{if(tx==null)return; const d=e.changedTouches[0].clientX-tx; if(Math.abs(d)>40)turn(d<0?1:-1); tx=null});

/* ----- 내려받기: 저장 위치를 묻는다 ----- */
async function download(b){
  if(window.showSaveFilePicker){
    let handle;
    try{
      handle=await showSaveFilePicker({suggestedName:b.fileName,types:[{description:'PDF 문서',accept:{'application/pdf':['.pdf']}}]});
    }catch(e){ if(e.name==='AbortError') return; handle=null; }
    if(handle){
      try{
        const res=await fetch(b.file); if(!res.ok) throw new Error(res.status);
        const w=await handle.createWritable(), rd=res.body.getReader(); let got=0;
        for(;;){const {done,value}=await rd.read(); if(done)break; await w.write(value); got+=value.length; toast(`저장하는 중… ${Math.round(got/b.size*100)}%`,60000)}
        await w.close(); toast(`「${handle.name}」으로 저장했습니다.`); return;
      }catch(e){ toast('저장하지 못했습니다. 브라우저 다운로드로 다시 받습니다.'); }
    }
  }
  // 저장 위치 창을 열 수 없는 브라우저(Safari 등)는 브라우저 기본 다운로드로 받는다
  const a=document.createElement('a'); a.href=b.file; a.download=b.fileName; document.body.appendChild(a); a.click(); a.remove();
  toast('내려받기를 시작했습니다. 브라우저 다운로드 목록에서 확인하세요.');
}

/* ----- 시작 ----- */
fetch('books.json',{cache:'no-cache'}).then(r=>r.json()).then(data=>{
  BOOKS=data.books.sort((a,b)=>b.date.localeCompare(a.date));
  const n=(data.notices||[])[0];
  if(n) $('noticeTop').innerHTML=`<a class="notice" href="#notices"><b>공지</b>${esc(n.title)}</a>`;
  const ns=data.notices||[]; NOTICES=ns;
  $('notices').hidden=!ns.length; $('noticeCount').textContent=ns.length?ns.length+'건':'';
  $('noticeList').innerHTML=ns.map(x=>`<li><time>${fmtDate(x.date)}</time><div><b>${esc(x.title)}</b>${x.body?`<p>${esc(x.body)}</p>`:''}</div></li>`).join('');
  layoutHall(); layoutWall();
});
/* ----- 시점: 글자는 그대로, 뒤의 책만 커서·스크롤에 따라 살짝 -----
   스프링(관성+감쇠)으로 따라가서 멈출 때 부드럽게 가라앉는다. 펼친 동안은 정면으로 돌아온다. */
(()=>{
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const hall=$('hall'), touch=!matchMedia('(hover:hover)').matches;
  const s={x:0,y:0,vx:0,vy:0}, goal={x:0,y:0}; let raf=0, last=0;
  const tick=now=>{
    const dt=Math.min(32,now-(last||now))/16.7; last=now;
    const open=document.body.classList.contains('has-open'), gx=open?0:goal.x, gy=open?0:goal.y;
    s.vx=(s.vx+(gx-s.x)*.018*dt)*Math.pow(.8,dt); s.vy=(s.vy+(gy-s.y)*.018*dt)*Math.pow(.8,dt);
    s.x+=s.vx*dt; s.y+=s.vy*dt;
    hall.style.setProperty('--rx',(s.x*7).toFixed(3)+'deg');
    hall.style.setProperty('--ry',(-s.y*5).toFixed(3)+'deg');
    hall.style.setProperty('--tx',(-s.x*12).toFixed(2)+'px');
    hall.style.setProperty('--ty',(-s.y*8).toFixed(2)+'px');
    if(Math.abs(gx-s.x)+Math.abs(gy-s.y)+Math.abs(s.vx)+Math.abs(s.vy)>.0005) raf=requestAnimationFrame(tick); else {raf=0;last=0}
  };
  const go=()=>{if(!raf)raf=requestAnimationFrame(tick)};
  addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return; goal.x=e.clientX/innerWidth*2-1; goal.y=e.clientY/innerHeight*2-1; go()});
  document.documentElement.addEventListener('mouseleave',()=>{goal.x=goal.y=0; go()});
  new MutationObserver(go).observe(document.body,{attributes:true,attributeFilter:['class']});
  addEventListener('scroll',()=>{
    const y=scrollY; hall.style.setProperty('--sy',(Math.min(y,innerHeight)*.1).toFixed(1)+'px');
    if(touch){goal.y=-Math.min(1,y/innerHeight); go()}
  },{passive:true});
})();
/* ----- 같은 쪽 안 이동은 부드럽게 흘러가듯 ----- */
function glide(to){
  const from=scrollY, d=to-from, dur=Math.min(1400,Math.max(700,Math.abs(d)*.6)), t0=performance.now();
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){scrollTo(0,to);return}
  const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
  const step=now=>{const k=Math.min(1,(now-t0)/dur); scrollTo(0,from+d*ease(k)); if(k<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]'); if(!a) return;
  const el=document.querySelector(a.getAttribute('href')); if(!el) return;
  e.preventDefault(); glide(Math.max(0,el.getBoundingClientRect().top+scrollY-80));
  history.replaceState(null,'',a.getAttribute('href'));
});
/* ----- 검색: 제목·설명·분류·공지에서 찾기 ----- */
let NOTICES=[];
const S={items:[],i:0};
function hl(s,q){const e=esc(s); if(!q) return e; const k=e.toLowerCase().indexOf(esc(q).toLowerCase()); return k<0?e:e.slice(0,k)+'<mark>'+e.slice(k,k+esc(q).length)+'</mark>'+e.slice(k+esc(q).length)}
function runSearch(){
  const q=$('sInput').value.trim(), ql=q.toLowerCase();
  const hit=s=>!ql||String(s||'').toLowerCase().includes(ql);
  S.items=[...BOOKS.filter(b=>hit(b.title)||hit(b.sub)||hit(b.kind)||hit(b.kicker)).map(b=>({t:'book',b})),
           ...NOTICES.filter(n=>hit(n.title)||hit(n.body)).map(n=>({t:'notice',n}))];
  S.i=0;
  $('sRes').innerHTML=S.items.length?S.items.map((x,k)=>x.t==='book'
    ?`<li data-k="${k}"><img src="${pageImg(x.b,1,1)}" alt=""><div><b>${hl(x.b.title,q)}</b><span>${esc(x.b.kind)} · ${x.b.pages}쪽 · ${fmtDate(x.b.date)}</span></div></li>`
    :`<li data-k="${k}"><span class="kind">공지</span><div><b>${hl(x.n.title,q)}</b><span>${fmtDate(x.n.date)}</span></div></li>`).join('')
    :`<li class="none">「${esc(q)}」에 맞는 자료가 없습니다.</li>`;
  mark();
}
const mark=()=>$('sRes').querySelectorAll('li[data-k]').forEach(li=>li.classList.toggle('on',+li.dataset.k===S.i));
function openSearch(){$('search').classList.add('on'); runSearch(); setTimeout(()=>$('sInput').focus(),50)}
function closeSearch(){$('search').classList.remove('on'); $('sInput').blur()}
function pick(k){
  const x=S.items[k]; if(!x) return; closeSearch();
  if(x.t==='notice'){glide(Math.max(0,$('notices').getBoundingClientRect().top+scrollY-80)); return}
  const cell=[...$('grid').querySelectorAll('.cell')].find(c=>c.querySelector('.slot').dataset.slug===x.b.slug);
  cell.classList.remove('hide');
  const y=Math.max(0,cell.getBoundingClientRect().top+scrollY-120);
  glide(y); setTimeout(()=>setOpen(cell.querySelector('.slot'),true),Math.min(1400,Math.max(700,Math.abs(y-scrollY)*.6))+60);
}
$('sOpen').onclick=e=>{e.stopPropagation(); openSearch()};
$('sClose').onclick=closeSearch;
$('sInput').addEventListener('input',runSearch);
$('sInput').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();S.i=Math.min(S.items.length-1,S.i+1);mark()}
  if(e.key==='ArrowUp'){e.preventDefault();S.i=Math.max(0,S.i-1);mark()}
  if(e.key==='Enter'){e.preventDefault();pick(S.i)}
  if(e.key==='Escape')closeSearch();
});
$('sRes').addEventListener('click',e=>{const li=e.target.closest('li[data-k]'); if(li) pick(+li.dataset.k)});
addEventListener('keydown',e=>{
  if($('viewer').classList.contains('on')||e.target.matches('input,textarea')) return;
  if(e.key==='/'||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k')){e.preventDefault(); openSearch()}
});
document.addEventListener('click',e=>{if($('search').classList.contains('on')&&!e.target.closest('#search')&&!e.target.closest('#sOpen'))closeSearch()});
let lastNarrow=narrowQ();
addEventListener('resize',()=>{
  if($('viewer').classList.contains('on')) placeStage();
  const n=narrowQ(); if(n!==lastNarrow){lastNarrow=n; layoutHall(); layoutWall()}
});
</script>
