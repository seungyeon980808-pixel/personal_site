# GitHub Pages serves the existing site without publishing development artifacts.
exclude:
  - node_modules
  - tests
  - test-results
  - playwright-report
  - tools
  # Exclude only the development docs directory and its contents.
  - docs/**
  - PRD
  - package.json
  - package-lock.json
  - playwright.config.mjs
  - firebase.json
  - firebase.rules-test.json
  - firestore.rules
  - firestore.indexes.json
  - final-index.sha256
  - CLAUDE.md
  - DESIGN.md
  - NEXT-STEPS.md
  - STUDIO.md
  - personal-site-plan.md
  # 5E에서 옮긴 memo·hub: 화면 파일만 공개(Worker 소스·검사·문서·의존성 목록은 뺌).
  - memo/worker
  - memo/tests
  - memo/scripts
  - memo/package.json
  - memo/package-lock.json
  - memo/assets.json
  - memo/DESIGN.md
  - memo/PRODUCT.md
  - memo/README.md
  - memo/surface-brief.md
  - hub/assets.json
  - hub/DESIGN.md
  - hub/PRODUCT.md
  - _work
