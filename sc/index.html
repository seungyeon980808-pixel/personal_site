<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sc — 우리끼리 소통 창구</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  color-scheme:dark;
  --ground:#0e0e13; --paper:#1f1d29; --inset:#14121a; --raised:#2b2737;
  --ink:#ffffff; --sub:#e6e1f2; --muted:#c7c0d8;
  --accent:#c9bdfa; --accent-hover:#ddd4ff; --accent-ink:#1f1834; --accent-soft:#2f2846;
  --line:#423d52; --control-line:#8a80a0; --hover:#332b44;
  --success:#bfe3cf; --done:#9fd8b8; --error:#ffbcc2; --red:#ff8f9b;
  --teacher:#f6dca8; --teacher-paper:#41372a; --teacher-line:#6a5838;
  --mine:#3a2f5c; --mine-line:#6f5ca8;
  --radius:16px; --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);background:var(--ground);font:17px/1.5 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow:hidden;user-select:none}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea{user-select:text}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background 140ms var(--ease),color 140ms var(--ease),transform 140ms var(--ease)}
button:active{transform:scale(.98)}
::selection{color:var(--accent-ink);background:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.icon{display:block;width:19px;height:19px;flex:none;fill:none;stroke:currentcolor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--control-line) transparent}

.shell{height:100svh;display:flex;flex-direction:column;background:radial-gradient(at 49% 41%,rgba(64,39,99,.22),transparent 54%),radial-gradient(at 87% 79%,rgba(40,49,85,.14),transparent 40%)}
.appbar{display:flex;align-items:center;gap:12px;min-height:50px;padding:4px 22px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand .icon{width:20px;height:20px;color:var(--accent)}
.wordmark{font-size:21px;font-weight:650;letter-spacing:-.035em;line-height:1}
.crumb{margin-left:4px;padding-left:14px;border-left:1px solid var(--line);font-size:16.5px;color:var(--muted);display:flex;align-items:center;gap:10px}
.crumb b{color:var(--ink);font-weight:650}
.crumb .who{color:var(--accent);font-weight:600}
.crumb .who.t{color:var(--teacher)}
.seg{display:flex;gap:4px;padding:3px;border-radius:11px;background:var(--inset);border:1px solid var(--line);margin-left:14px}
.seg button{min-height:34px;padding:2px 14px;border-radius:8px;color:var(--muted);font-size:16px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--ink);box-shadow:inset 0 0 0 1px var(--control-line)}
.seg .n{color:var(--red);font-variant-numeric:tabular-nums}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.button{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:4px 14px;border-radius:10px;color:var(--sub);font-size:16px;font-weight:600}
.button:hover{background:var(--hover);color:var(--ink)}
.button.solid{color:var(--accent-ink);background:var(--accent)}
.button.solid:hover{background:var(--accent-hover)}
.clock{font-size:15.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px}

.stage{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}
.view.on{display:flex}

.desk{background:var(--paper);border-radius:var(--radius);box-shadow:0 16px 48px rgba(0,0,0,.3);display:flex;flex-direction:column;min-height:0;min-width:0;border:1px solid #2a2635;overflow:hidden}
.desk-head{display:flex;align-items:center;gap:8px;padding:12px 14px 10px 18px;min-height:58px;flex:none;white-space:nowrap}
.desk-head .grow{flex:1}
h2{display:flex;align-items:center;gap:8px;margin:0;font-size:19px;font-weight:680;letter-spacing:-.02em}
h2 .icon{color:var(--accent)}
.caption{color:var(--muted);font-size:14.5px;display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis}
.caption .icon{width:15px;height:15px}
.count{color:var(--accent);font-variant-numeric:tabular-nums;font-size:16px;margin-left:2px}
.add{display:none;align-items:center;gap:5px;min-height:38px;padding:0 12px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-size:14.5px;font-weight:700;flex:none}
.add .icon{width:16px;height:16px}
.add:hover{background:var(--hover)}
body.tmode .add{display:inline-flex}
.desk-foot{padding:12px 22px 16px;color:var(--muted);font-size:15px;display:flex;align-items:center;gap:8px}
.desk-foot .icon{width:16px;height:16px}

/* 로그인 */
#login{align-items:center;justify-content:center}
#login .desk{width:500px;overflow:visible}
#login .desk-head{flex-direction:column;align-items:flex-start;gap:4px;padding:26px 28px 6px;white-space:normal}
#login h2{font-size:27px}
#login h2 .icon{width:24px;height:24px}
#login .caption{font-size:17px}
.dots{display:flex;justify-content:center;gap:22px;padding:20px 0 6px}
.dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--control-line)}
.dots i.f{background:var(--accent);border-color:var(--accent)}
.dots.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.lock-msg{text-align:center;color:var(--muted);font-size:18px;min-height:28px}
.lock-msg.err{color:var(--error);font-weight:600}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px 28px 6px}
.pad button{height:88px;border-radius:12px;background:var(--inset);border:1px solid var(--line);font-size:36px;font-weight:550;font-variant-numeric:tabular-nums}
.pad button:hover{background:var(--hover)}
.pad .fn{background:none;border-color:transparent;color:var(--sub);font-size:18px;display:flex;align-items:center;justify-content:center;gap:6px}
#login .desk-foot{font-size:16px}

/* 8칸 배치 */
#room{display:none;gap:16px;padding:16px 22px;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,.85fr) minmax(0,1.15fr);
  grid-template-areas:"notice notice cal cal" "day todo poll talk"}
#room.on{display:grid}
.a-notice{grid-area:notice}.a-cal{grid-area:cal}.a-day{grid-area:day}.a-todo{grid-area:todo}.a-poll{grid-area:poll}.a-talk{grid-area:talk}

.x{width:34px;height:34px;border-radius:8px;display:none;align-items:center;justify-content:center;color:var(--muted);flex:none}
.x:hover{background:var(--hover);color:var(--error)}
.x.ed:hover{color:var(--accent)}
.x .icon{width:16px;height:16px}
body.tmode .x{display:inline-flex}
.empty{color:var(--muted);font-size:15px;padding:10px 2px}

/* 게시판 */
.stickies{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));align-content:start;gap:14px;padding:4px 18px 18px}
.sticky{--p:#2e283e;--i:#f3edfd;--m:#cfc4e3;background:var(--p);color:var(--i);border-radius:6px;box-shadow:0 8px 22px rgba(0,0,0,.24);transform:rotate(var(--tilt,-.4deg));padding:12px 15px 13px;position:relative;display:flex;flex-direction:column;gap:5px;cursor:pointer}
.sticky[data-c=amber]{--p:#3d3426;--i:#f8eedb;--m:#dfcdac}
.sticky[data-c=slate]{--p:#263645;--i:#e6f1fb;--m:#b8cddd}
.sticky[data-c=rose]{--p:#3c2934;--i:#f9e8f0;--m:#dfbccb}
.sticky .bar{display:flex;align-items:center;gap:6px;color:var(--m);font-size:13px;font-weight:600}
.sticky .bar .icon{width:14px;height:14px}
.sticky .new{color:#2b1016;background:var(--red);padding:0 7px;border-radius:10px;font-size:12px;font-weight:750;line-height:19px}
.sticky .title{font-size:17.5px;font-weight:680;letter-spacing:-.02em;line-height:1.35}
body.tmode .sticky .title{padding-right:70px}
.sticky .body{font-size:15px;line-height:1.55;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sticky.open .body{display:block}
.sticky .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.sticky .links a{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 12px;border-radius:8px;background:rgba(255,255,255,.1);color:var(--i);text-decoration:none;font-size:14.5px;font-weight:650;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.sticky .links a:hover{background:rgba(255,255,255,.17)}
.sticky .links .icon{width:15px;height:15px}
.sticky .x{position:absolute;right:5px;top:5px;color:var(--m)}
.sticky .x.ed{right:40px}

/* 달력 */
.nav{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;color:var(--sub);background:var(--inset);border:1px solid var(--line);flex:none}
.nav:hover{background:var(--hover)}
.nav .icon{width:18px;height:18px}
.pill{min-height:40px;padding:0 14px;border-radius:9px;color:var(--sub);font-size:15px;font-weight:600;background:var(--inset);border:1px solid var(--line);flex:none}
.pill:hover{background:var(--hover)}
.mlabel{font-size:19px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;padding:0 6px}
.wds,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;padding:0 14px}
.wd{text-align:center;font-size:13.5px;color:var(--muted);font-weight:650;padding:0 0 4px}
.wd.sun,.cell.sun .num{color:#ffb3bf}
.wd.sat,.cell.sat .num{color:#b7cdf5}
.grid{flex:1;min-height:0;grid-auto-rows:minmax(0,1fr);padding-bottom:14px}
.cell{min-height:0;border-radius:8px;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:4px 5px 3px;background:rgba(255,255,255,.03);text-align:left;min-width:0;overflow:hidden}
.cell:hover{background:var(--hover)}
.cell .top{display:flex;align-items:center;justify-content:space-between;gap:2px;flex:none}
.cell .num{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
.cell .talk{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-weight:650;font-variant-numeric:tabular-nums;padding-right:2px}
.cell .talk .icon{width:12px;height:12px}
.cell.out{opacity:.38}
.cell.today .num{background:var(--accent);color:var(--accent-ink)!important;font-weight:750}
.cell[aria-pressed=true]{background:var(--raised);box-shadow:inset 0 0 0 2px var(--accent)}
.chip{display:block;flex:none;font-size:12.5px;line-height:1.3;font-weight:600;padding:1px 5px;border-radius:4px;background:var(--accent-soft);color:#e6defd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid var(--accent)}
.chip .t{color:var(--accent);margin-right:3px;font-variant-numeric:tabular-nums}
.more{font-size:11.5px;color:var(--muted);padding-left:4px;font-weight:600}

/* 선택한 날 */
.list{flex:1;min-height:0;padding:0 14px 14px}
.daytitle{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:650;color:var(--sub)}
.rel{font-size:13px;color:var(--accent);background:var(--accent-soft);padding:1px 9px;border-radius:20px;font-weight:650}
.ev{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:10px 12px;border-radius:10px;background:var(--inset);border:1px solid var(--line);margin-bottom:8px}
.ev .time{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.ev .time.all{color:var(--muted);font-weight:600}
.ev .what{font-size:16.5px;font-weight:700;line-height:1.35}
.ev .place{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--sub);margin-top:2px}
.ev .place .icon{width:14px;height:14px;color:var(--muted)}
.ev .memo{font-size:14px;color:var(--muted);margin-top:3px;line-height:1.5;white-space:pre-wrap}
.ev .acts{display:flex;gap:2px;align-self:start;grid-row:1/span 3;grid-column:2}
.minor{font-size:13.5px;color:var(--muted);font-weight:650;margin:12px 2px 4px}
.next{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid var(--line);font-size:14.5px;width:100%;text-align:left}
.next:last-child{border-bottom:0}
.next .dt{flex:none;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13.5px;width:72px}
.next .w{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next .dd{font-size:13px;font-weight:700;color:var(--accent);flex:none}

/* 할 일 */
.todo{border-bottom:1px solid var(--line);padding:9px 2px}
.todo:last-child{border-bottom:0}
.todo .row{display:flex;align-items:flex-start;gap:10px}
.check{width:32px;height:32px;border-radius:50%;border:2px solid var(--control-line);display:grid;place-items:center;flex:none;color:transparent}
.check .icon{width:17px;height:17px;stroke-width:2.4}
.todo.done .check{background:var(--done);border-color:var(--done);color:#123222}
.check[disabled]{cursor:default}
.todo .w{flex:1;min-width:0}
.todo .text{font-size:16px;font-weight:650;line-height:1.4}
.todo.done .text{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--control-line)}
.todo .meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13.5px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;padding:0 8px;border-radius:20px;background:var(--raised);color:var(--sub);font-weight:650;font-size:12.5px;line-height:21px}
.tag.me{background:var(--accent);color:var(--accent-ink)}
.tag.late{background:#4a2730;color:var(--red)}
.prog{height:6px;border-radius:3px;background:var(--raised);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--done);border-radius:3px}
.todo .left{font-size:13.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.todo .left b{color:var(--sub);font-weight:600}
.tgroup{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--muted);padding:6px 2px 2px;margin-top:6px}
.tgroup:first-child{margin-top:0}
.tgroup span{font-weight:500;font-size:12.5px;display:inline-flex;align-items:center}
.todo.priv .check{border-radius:9px}
.x.own{display:inline-flex}
body.assign #addTodo{display:inline-flex}
.mytodo{margin:0 12px 12px;display:flex;gap:6px;padding:5px;border-radius:11px;background:var(--inset);border:1px solid var(--control-line);flex:none}
.mytodo:focus-within{border-color:var(--accent)}
.mytodo input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:16px;padding:0 8px;min-height:40px;caret-color:var(--accent)}
.mytodo .send{min-height:40px;padding:4px 12px;font-size:15px}

/* 투표 */
.poll{padding:10px 12px 12px;border-radius:10px;background:var(--inset);border:1px solid var(--line);margin-bottom:10px}
.poll .q{display:flex;align-items:flex-start;gap:6px}
.poll .q b{flex:1;font-size:16px;font-weight:700;line-height:1.4}
.opt{position:relative;display:flex;align-items:center;gap:8px;width:100%;min-height:42px;margin-top:6px;padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--paper);text-align:left;overflow:hidden;font-size:15px;font-weight:600}
.opt:hover{border-color:var(--control-line)}
.opt .fill{position:absolute;inset:0 auto 0 0;background:var(--accent-soft);transition:width 300ms var(--ease)}
.opt>span{position:relative}
.opt .lab{flex:1;min-width:0}
.opt .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.opt.mine{border-color:var(--accent)}
.opt.mine .lab::after{content:" ✓";color:var(--accent)}
.opt[disabled]{cursor:default}
.poll .foot{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin-top:8px}
.poll .foot .closed{color:var(--teacher);font-weight:650}
.poll .foot .mini{margin-left:auto;min-height:32px;padding:0 10px;border-radius:7px;background:var(--raised);color:var(--sub);font-size:13.5px;font-weight:650}

/* 메신저 */
.tabs{display:flex;align-items:flex-end;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap;min-width:0;flex:none}
.tab{position:relative;flex:none;display:inline-flex;align-items:center;gap:7px;min-height:48px;padding:4px 12px 10px;font-size:17px;font-weight:680;color:var(--muted)}
.tab .icon{width:18px;height:18px}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px;background:var(--accent)}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--red);color:#2b1016;font-size:13px;font-weight:750;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.tab .sub{font-size:13px;font-weight:500;color:var(--muted)}
.daynav{margin-left:auto;align-self:center;display:flex;align-items:center;gap:4px;padding-bottom:6px;flex:none}
.daynav .d{font-size:14.5px;font-weight:650;padding:0 4px;font-variant-numeric:tabular-nums;color:var(--sub)}
.daynav .d.today{color:var(--accent)}
.daynav .nav{width:34px;height:34px}
.l-short{display:none}
.inbox{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin;flex:none}
.inbox button{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:20px;background:var(--inset);border:1px solid var(--line);font-size:14.5px;font-weight:600;color:var(--sub)}
.inbox button.has{color:var(--ink);border-color:var(--control-line)}
.inbox button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.inbox .badge{min-width:18px;height:18px;font-size:11px;padding:0 5px}
.chat{flex:1;min-height:0;padding:12px 14px 8px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;align-self:flex-start;display:flex;flex-direction:column;gap:3px}
.msg .meta{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);padding:0 3px;white-space:nowrap}
.msg .meta b{color:var(--ink);font-weight:700;font-size:14px}
.msg .text{background:var(--raised);border:1px solid #4a4459;border-radius:4px 13px 13px 13px;padding:8px 13px;font-size:17px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msg .text a{color:var(--accent);text-decoration:underline;text-underline-offset:3px;word-break:break-all}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg.mine .text{background:var(--mine);border-color:var(--mine-line);border-radius:13px 4px 13px 13px}
.msg.t .meta b{color:var(--teacher)}
.msg.t .text{background:var(--teacher-paper);border-color:var(--teacher-line);color:#fbf0da}
.msg.cont{margin-top:-5px}
.msg.cont .meta{display:none}
body.tmode .msg.cont .meta{display:flex}
.msg .read{color:var(--accent);font-weight:650}
.msg .x{width:28px;height:28px}
.hello{margin:auto;text-align:center;color:var(--muted);font-size:15.5px;line-height:1.65}
.hello .icon{width:30px;height:30px;margin:0 auto 6px;color:var(--accent)}
.past{margin:0 10px 6px;padding:3px 4px 3px 10px;border-radius:9px;background:var(--accent-soft);display:flex;align-items:center;gap:8px;color:var(--sub);font-size:13.5px;white-space:nowrap;overflow:hidden;flex:none}
.past span{overflow:hidden;text-overflow:ellipsis}
.past .pill{margin-left:auto;min-height:32px;font-size:13.5px;padding:0 10px}
.composer{margin:0 10px 10px;min-width:0;background:var(--inset);border:1px solid var(--control-line);border-radius:11px;display:flex;align-items:center;gap:6px;padding:5px;flex:none}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.composer input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:17px;padding:0 8px;caret-color:var(--accent);min-height:44px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
.send{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:5px 16px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:700}
.send:hover{background:var(--accent-hover)}
.send .icon{width:16px;height:16px}

/* 창 */
dialog{border:0;padding:0;background:var(--paper);color:var(--ink);border-radius:var(--radius);box-shadow:0 24px 80px rgba(0,0,0,.5);width:min(620px,92vw);max-height:90vh}
dialog::backdrop{background:rgba(8,8,12,.66)}
dialog .desk-head{padding:18px 22px 10px}
.form{padding:0 22px 22px;display:flex;flex-direction:column;gap:10px}
.field{background:var(--inset);border:1px solid var(--control-line);border-radius:11px;overflow:hidden}
.field:focus-within{border-color:var(--accent)}
.field input,.field textarea,.field select{display:block;width:100%;border:0;outline:none;background:transparent;padding:13px 16px;font-size:18px;caret-color:var(--accent)}
.field select{appearance:none;background:transparent}
.field textarea{min-height:96px;resize:vertical;line-height:1.6;border-top:1px solid var(--line)}
.field .split{display:flex}
.field .split+.split,.field input+.split,.field .split+textarea,.field input+input{border-top:1px solid var(--line)}
.field .split>*{flex:1;width:auto;min-width:0}
.field .split>*+*{border-left:1px solid var(--line)}
.field .split .ln{flex:0 0 34%}
.label{font-size:14.5px;color:var(--muted);padding:2px 2px 0}
.colors{display:flex;gap:8px;align-items:center}
.colors button{width:38px;height:38px;border-radius:50%;border:2px solid transparent}
.colors button[aria-pressed=true]{border-color:var(--ink)}
.row-end{display:flex;justify-content:flex-end;gap:8px;align-items:center;padding-top:4px}
.row-end .left{margin-right:auto}
.ghost{min-height:46px;padding:6px 18px;border-radius:9px;color:var(--sub);font-size:16px;font-weight:600}
.ghost:hover{background:var(--hover);color:var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:5px 12px;border-radius:9px;color:var(--sub);font-size:15px;font-weight:600}
.toggle[aria-pressed=true]{color:var(--accent);background:var(--accent-soft)}
.toggle .icon{width:17px;height:17px}
.rooms-pick{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rooms-pick .label{padding:0 6px 0 2px}

.roster{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;padding:0 22px}
.roster .r{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.roster .r .nm{flex:1;min-width:0;font-size:16px;background:transparent;border:1px solid transparent;border-radius:7px;padding:4px 8px;outline:none}
.roster .r .nm:hover{border-color:var(--line)}
.roster .r .nm:focus{border-color:var(--accent);background:var(--inset)}
.roster .r .cd{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.08em;color:var(--accent)}
.roster .r button{min-height:36px;padding:0 9px;border-radius:7px;font-size:13.5px;color:var(--muted)}
.roster .r button:hover{background:var(--hover);color:var(--ink)}

.status{position:fixed;top:12px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:10px;background:var(--raised);color:var(--success);font-size:16.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;pointer-events:none;z-index:20;transition:opacity 140ms var(--ease);white-space:nowrap}
.status.visible{opacity:1}
.status.act{pointer-events:auto}
.status.warn{color:var(--teacher)}
.status .undo{margin-left:12px;min-height:36px;padding:0 14px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.demo{position:fixed;left:26px;bottom:10px;font-size:13px;color:var(--muted);opacity:.75;margin:0}

/* 칸 폭이 좁을 때 */
.a-cal{container-type:inline-size}
@container (max-width:560px){
  .chip{font-size:11.5px;padding:1px 3px}
  .chip .t{display:none}
  .cell .talk .icon{display:none}
}
.a-talk{container-type:inline-size}
@container (max-width:470px){
  .tab .sub,.tab .icon,.l-long{display:none}
  .l-short{display:inline}
  .tab{padding:4px 8px 10px;font-size:16px}
}
@container (max-width:400px){
  .send span{display:none}
  .send{padding:5px 12px}
  .past span{font-size:12.5px}
}

@media (max-height:860px){
  .appbar{min-height:46px;padding:3px 18px}
  #room{padding:12px 18px;gap:12px}
  .desk-head{min-height:50px;padding:8px 12px 6px 16px}
  .stickies{padding:2px 14px 14px;gap:12px}
  .grid{padding-bottom:10px;gap:2px}
  .cell{padding:2px 4px;gap:1px}
  .cell .num{width:22px;height:22px;font-size:13.5px}
  .chip{font-size:11.5px;line-height:1.25;padding:0 4px}
  .tab{min-height:42px}
  .chat{padding:8px 12px 6px;gap:8px}
  .msg .text{font-size:16px;padding:6px 11px}
}
@media (max-width:1279px){
  body{overflow:auto}
  .shell{height:auto;min-height:100svh}
  .view{position:relative}
  #room{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none;grid-auto-rows:auto;
    grid-template-areas:"notice notice" "cal cal" "talk day" "todo poll";padding:16px}
  .a-notice{min-height:340px}.a-cal{height:560px}.a-talk{height:620px}.a-day,.a-todo,.a-poll{min-height:360px;max-height:620px}
  #login{padding:40px 16px}
}
@media (max-width:760px){
  #room{grid-template-columns:minmax(0,1fr);grid-template-areas:"notice" "talk" "cal" "day" "todo" "poll"}
  .appbar{padding:10px 16px;flex-wrap:wrap}
  .crumb{display:none}
  .button span,.clock{display:none}
}

const safeUrl=u=>{ if(!u) return ''; try{ const x=new URL(/^https?:\/\//i.test(u)?u:'https://'+u); return /^https?:$/.test(x.protocol)?x.href:'' }catch{ return '' } };
const D=864e5;
const today=()=>{ const x=new Date(); x.setHours(0,0,0,0); return x };
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromIso=s=>new Date(s+'T00:00');
const shift=(s,n)=>{ const d=fromIso(s); d.setDate(d.getDate()+n); return iso(d) };
const plus=n=>shift(iso(today()),n);
const at=(n,h,m=0)=>{ const d=today(); d.setDate(d.getDate()+n); d.setHours(h,m); return d.getTime() };
const W='일월화수목금토';
const hm=t=>{ const d=new Date(t); return `${d.getHours()<12?'오전':'오후'} ${(d.getHours()%12)||12}:${String(d.getMinutes()).padStart(2,'0')}` };
const hhmm=s=>{ if(!s) return ''; const [h,m]=s.split(':').map(Number); return `${h<12?'오전':'오후'} ${(h%12)||12}:${String(m).padStart(2,'0')}` };
const short=s=>{ if(!s) return ''; const [h,m]=s.split(':').map(Number); return `${h}:${String(m).padStart(2,'0')}` };
const ago=t=>{ const m=Math.round((Date.now()-t)/6e4); return m<1?'방금':m<60?m+'분 전':m<1440?Math.round(m/60)+'시간 전':Math.round(m/1440)+'일 전' };
const rel=s=>{ const n=Math.round((fromIso(s)-today())/D); return n===0?'오늘':n===1?'내일':n===-1?'어제':n>0?`D-${n}`:`${-n}일 전` };
const dlabel=s=>{ const d=fromIso(s); return `${d.getMonth()+1}월 ${d.getDate()}일 ${W[d.getDay()]}요일` };
const dshort=s=>{ const d=fromIso(s); return `${d.getMonth()+1}/${d.getDate()} (${W[d.getDay()]})` };
const dayOf=t=>iso(new Date(t));
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const newCode=used=>{ let c; do{ c=String(crypto.getRandomValues(new Uint32Array(1))[0]%9000+1000) }while(used.has(c)||/^(\d)\1+$/.test(c)||'0123456789'.includes(c)||'9876543210'.includes(c)); return c };

/* =========================================================================
   저장소 — 화면 코드는 아래 store 만 부른다 (서버 / 시안 둘 다 같은 모양)
   NOW: 서버 시각, DEL: 필드 지우기
   ========================================================================= */
const NOW={__now:1}, DEL={__del:1};
let fb=null, unsubs=[];
async function sdk(){
  if(fb) return fb;
  const [A,B,C]=await Promise.all([import(SDK+'firebase-app.js'),import(SDK+'firebase-auth.js'),import(SDK+'firebase-firestore.js')]);
  const app=A.initializeApp(firebaseConfig,'sc');
  fb={a:B,f:C,auth:B.getAuth(app),fs:C.getFirestore(app)};
  await fb.auth.authStateReady();
  return fb;
}
const toFs=(o)=>{ const {f}=fb, out={};
  for(const [k,v] of Object.entries(o)){
    if(v===NOW) out[k]=f.serverTimestamp(); else if(v===DEL) out[k]=f.deleteField();
    else if(k==='at'&&typeof v==='number') out[k]=f.Timestamp.fromMillis(v);
    else if(k==='doneBy'&&v&&typeof v==='object') out[k]=Object.fromEntries(Object.entries(v).map(([a,b])=>[a,typeof b==='number'?f.Timestamp.fromMillis(b):b]));
    else out[k]=v;
  } return out };
const fromFs=d=>{ const x=d.data({serverTimestamps:'estimate'}); const t=v=>v?.toMillis?v.toMillis():v;
  if(x.at!==undefined) x.at=t(x.at)||Date.now();
  if(x.doneBy) for(const k in x.doneBy) x.doneBy[k]=t(x.doneBy[k]);
  return {id:d.id,...x} };
const ref=(r,c,id)=>id?fb.f.doc(fb.fs,'sc-rooms',r,c,id):fb.f.collection(fb.fs,'sc-rooms',r,c);

const store={
  add:(r,c,data)=>DEMO?demo.add(r,c,data):fb.f.addDoc(ref(r,c),toFs(data)).catch(failed),
  set:(r,c,id,data)=>DEMO?demo.set(r,c,id,data):fb.f.setDoc(ref(r,c,id),toFs(data)).catch(failed),
  patch:(r,c,id,data)=>DEMO?demo.patch(r,c,id,data):fb.f.updateDoc(ref(r,c,id),toFs(data)).catch(failed),
  remove:(r,c,id)=>DEMO?demo.remove(r,c,id):fb.f.deleteDoc(ref(r,c,id)).catch(failed),
  seen:(r,memberId,data)=>{ const cur=seenDocs[r][memberId]||{}; seenDocs[r][memberId]={...cur,...data,threads:{...cur.threads,...data.threads}};
    if(DEMO) return demo.save(); fb.f.setDoc(fb.f.doc(fb.fs,'sc-rooms',r,'seen',memberId),data,{merge:true}).catch(e=>console.warn(e)) },
};

/* ---------- 서버: 들어가기 · 구독 · 나가기 ---------- */
async function serverLogin(code){
  const key=await sha(SALT+code);
  const {a,f,auth,fs}=await sdk();
  if(!auth.currentUser) await a.signInAnonymously(auth);
  const m=await f.getDoc(f.doc(fs,'sc-members',key));
  if(!m.exists()) return null;
  const d=m.data();
  await f.setDoc(f.doc(fs,'sc-sessions',auth.currentUser.uid),{member:d.id,key,room:d.room,role:d.role});
  return {id:d.id,name:d.name,room:d.room==='all'?null:d.room,role:d.role,teacher:d.role==='teacher'};
}
function subscribe(r){
  const {f,fs}=fb, cut=f.Timestamp.fromMillis(Date.now()-150*D);
  const on=(q,cb)=>unsubs.push(f.onSnapshot(q,s=>{ cb(s); schedule() },e=>{ console.warn(e); if(me) status('연결이 끊겼어요. 나갔다가 다시 들어와 주세요',true) }));
  on(ref(r,'notices'),s=>db[r].notices=s.docs.map(fromFs));
  on(ref(r,'events'),s=>db[r].events=s.docs.map(fromFs));
  on(ref(r,'polls'),s=>db[r].polls=s.docs.map(fromFs));
  on(f.query(ref(r,'chat'),f.where('at','>=',cut)),s=>db[r].chat=s.docs.map(fromFs).sort((a,b)=>a.at-b.at));
  on(isT()?f.query(ref(r,'dm'),f.where('at','>=',cut)):f.query(ref(r,'dm'),f.where('student','==',me.id)),s=>{
    const g={}; s.docs.map(fromFs).sort((a,b)=>a.at-b.at).forEach(m=>(g[m.student]||=[]).push(m)); db[r].dms=g });
  if(isT()) on(f.query(ref(r,'todos'),f.where('private','==',false)),s=>db[r].todos=s.docs.map(fromFs));
  else { let shared=[],mine=[]; const merge=()=>{ const m=new Map(); [...shared,...mine].forEach(t=>m.set(t.id,t)); db[r].todos=[...m.values()] };
    on(f.query(ref(r,'todos'),f.where('private','==',false)),s=>{ shared=s.docs.map(fromFs); merge() });
    on(f.query(ref(r,'todos'),f.where('owner','==',me.id)),s=>{ mine=s.docs.map(fromFs); merge() }) }
  on(ref(r,'seen'),s=>{ seenDocs[r]=Object.fromEntries(s.docs.map(d=>[d.id,d.data()])); initNoticeSince(r) });
  on(f.doc(fs,'sc-directory',r),s=>dir[r]=s.data()?.people||[]);
}
function initNoticeSince(r){
  if(noticeInit||isT()||r!==me?.room) return; noticeInit=true;
  noticeSince=seenDocs[r][me.id]?.n??(Date.now()-1.5*D); store.seen(r,me.id,{n:Date.now()});
}
async function serverLogout(){
  unsubs.forEach(u=>u()); unsubs=[];
  try{ if(fb?.auth.currentUser) await fb.f.deleteDoc(fb.f.doc(fb.fs,'sc-sessions',fb.auth.currentUser.uid)) }catch(e){ console.warn(e) }
}

function wrong(msg){
  const d=$('#dots'); d.classList.remove('err'); void d.offsetWidth; d.classList.add('err');
  lockMsg(msg,true); entry=''; dots();
}
async function press(k){
  lastTouch=Date.now();
  if(busy) return;
  if(Date.now()<lockedUntil){ lockMsg(`잠시 뒤에 다시 눌러 주세요 (${Math.ceil((lockedUntil-Date.now())/1000)}초)`,true); return }
  if(k==='clear'){ entry=''; dots(); return }
  if(k==='del'){ entry=entry.slice(0,-1); dots(); return }
  if(entry.length>=CODE_LEN) return; entry+=k; dots(); lockMsg('&nbsp;');
  if(entry.length<CODE_LEN) return;
  busy=true; lockMsg('확인하는 중…');
  try{
    let p=null;
    if(DEMO){ const x=demo.people.find(x=>x.code===entry); if(x) p={id:x.id,name:x.name,room:x.room==='all'?null:x.room,role:x.role,teacher:x.role==='teacher'} }
    else p=await serverLogin(entry);
    if(p){ fails=0; await login(p); return }
    if(++fails>=5){ fails=0; lockedUntil=Date.now()+30000 }
    wrong(Date.now()<lockedUntil?'5번 틀렸어요. 30초 뒤에 다시 눌러 주세요':'없는 번호예요. 다시 눌러 주세요');
  }catch(e){ console.warn(e); wrong('연결이 안 돼요. 인터넷을 확인해 주세요') }
  finally{ busy=false }
}

function renderCal(){

  $('#monthLabel').textContent=`${y}. ${mo+1}월`;
  const start=new Date(y,mo,1); start.setDate(1-start.getDay());
  const weeks=Math.ceil((new Date(y,mo,1).getDay()+new Date(y,mo+1,0).getDate())/7);
  const evs=[...db[room].events].sort(evSort), t0=iso(today()), talk=reading()?thread():[];
  let h='';
  for(let i=0;i<weeks*7;i++){

      <span class="top"><span class="num">${d.getDate()}</span>${nt?`<span class="talk">${ic('i-bubble')}${nt}</span>`:''}</span>${chips}</button>`;

}

/* ---------- ④ 할 일 ---------- */
// 맡기기: 선생님 + 학생회장(leader) / 내 체크리스트: 학생 본인만 보고 체크
const canAssign=()=>isT()||me?.role==='leader';
const mineTodo=t=>t.owner===null||t.owner===me.id;
const isDone=t=>t.owner ? !!t.doneBy[t.owner] : (me.id===t.by||isT() ? Object.keys(t.doneBy).length>=roomPeople(room).length : !!t.doneBy[me.id]);
const canDelTodo=t=>isT()||t.by===me.id;
const tSort=(a,b)=>(isDone(a)-isDone(b))||(a.due||'9999').localeCompare(b.due||'9999')||(a.at||0)-(b.at||0);
function todoRow(t){
  const total=roomPeople(room).length, done=isDone(t), n=Object.keys(t.doneBy).length;
  const late=!done&&t.due&&t.due<iso(today());
  const canCheck=!isT()&&(t.private?t.owner===me.id:mineTodo(t));
  const watching=!t.private&&(isT()||t.by===me.id);
  const who=t.private?'':t.owner?`<span class="tag ${t.owner===me.id?'me':''}">${t.owner===me.id?'내 일':esc(nameOf(t.owner))}</span>`:`<span class="tag">모두</span>`;
  const due=t.due?`<span class="${late?'tag late':''}">${late?'마감 지남':`${dshort(t.due)} 까지 · ${rel(t.due)}`}</span>`:'';
  const from=!t.private&&t.by&&t.by!==me.id?`<span>${esc(nameOf(t.by))}이 맡김</span>`:'';
  const prog=!t.owner&&!t.private?`<div class="prog"><i style="width:${Math.round(n/Math.max(total,1)*100)}%"></i></div>`:'';
  const missing=watching&&!t.owner&&openTodo===t.id?`<div class="left">아직: <b>${roomPeople(room).filter(p=>!t.doneBy[p.id]).map(p=>esc(p.name)).join(', ')||'없음'}</b></div>`:'';
  const meta=[who,due,!t.owner&&!t.private?`<span>${n}/${total}명 완료</span>`:'',from].filter(Boolean).join('');
  return `<div class="todo ${done?'done':''} ${t.private?'priv':''}" data-todo="${t.id}"><div class="row">
    <button class="check" ${canCheck?'':'disabled'} data-check="${t.id}" aria-label="${done?'다 함':'안 함'}">${ic('i-check')}</button>
    <div class="w"><div class="text">${esc(t.text)}</div>${meta?`<div class="meta">${meta}</div>`:''}${prog}${missing}</div>
    <button class="x ${canDelTodo(t)&&!isT()?'own':''}" data-del="todos:${t.id}" aria-label="할 일 지우기">${ic('i-x')}</button></div></div>`;
}
function renderTodos(){
  const all=db[room].todos;
  const assigned=all.filter(t=>!t.private&&(isT()||mineTodo(t)||t.by===me.id)).sort(tSort);
  const mine=isT()?[]:all.filter(t=>t.private&&t.owner===me.id).sort(tSort);
  const left=[...assigned.filter(t=>isT()||mineTodo(t)),...mine].filter(t=>!isDone(t)).length;
  $('#tCount').textContent=left||'';
  let h='';
  if(!isT()) h+=`<div class="tgroup">맡은 일</div>`;
  h+=assigned.length?assigned.map(todoRow).join(''):'<p class="empty">맡은 일이 없어요</p>';
  if(!isT()){
    h+=`<div class="tgroup">내 체크리스트 <span>나만 봐요</span></div>`;
    h+=mine.length?mine.map(todoRow).join(''):'<p class="empty">아래에 할 일을 적어 보세요</p>';
  }
  $('#todos').innerHTML=h;
  $('#myTodoForm').hidden=isT();
  document.body.classList.toggle('assign',canAssign());
}

/* ---------- ⑥ 메신저 ---------- */
const thread=()=> tab==='all' ? db[room].chat : (db[room].dms[isT()?dmWith:me.id]||[]);
const reading=()=>!(tab==='dm' && isT() && !dmWith);
const seenOf=(r,id)=>seenDocs[r]?.[id]||{};
const tSeen=(r,sid)=>seenOf(r,'t').threads?.[sid]||0;
const lastFromStudent=(r,id)=>(db[r].dms[id]||[]).filter(m=>m.from!=='t').at(-1)?.at||0;
const lastFromTeacher=(r,id)=>(db[r].dms[id]||[]).filter(m=>m.from==='t').at(-1)?.at||0;
const unreadFor=r=>roomPeople(r).filter(p=>lastFromStudent(r,p.id)>tSeen(r,p.id)).length;
const myUnread=()=>lastFromTeacher(room,me.id)>(seenOf(room,me.id).dm||0)?1:0;
function markRead(){
  const latest=thread().at(-1)?.at||0; if(!latest) return;
  if(isT()){ if(latest>tSeen(room,dmWith)) store.seen(room,'t',{threads:{[dmWith]:Math.max(Date.now(),latest)+1}}) }
  else if(latest>(seenOf(room,me.id).dm||0)) store.seen(room,me.id,{dm:Math.max(Date.now(),latest)+1});
}
function renderTalk(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===tab));
  $('#allSub').textContent=`${roomPeople(room).length}명`;
  $('#dmLabel').textContent=isT()?'1:1':'선생님께';
  $('#inbox').hidden=!(tab==='dm'&&isT());
  const dl=$('#dayLabel'); dl.textContent=selDate===iso(today())?`오늘 ${dshort(selDate).split(' ')[0]}`:dshort(selDate); dl.classList.toggle('today',selDate===iso(today()));

  const rd=reading();
  if(tab==='dm' && rd) markRead();
  if(tab==='dm' && isT()) renderInbox();
  const badge=isT()?unreadFor(room):(tab==='dm'?0:myUnread());
  $('#dmBadge').hidden=!badge; $('#dmBadge').textContent=badge;

  const isToday=selDate===iso(today());
  $('#composer').hidden=!rd;
  $('#past').hidden=!rd||isToday;
  $('#pastText').textContent=`${dshort(selDate)}를 보는 중 · 보내면 오늘로 올라가요`;
  $('#msg').placeholder = tab==='all' ? `${ROOMS[room].name} 모두에게` : isT() ? `${nameOf(dmWith)}에게 답장` : '선생님께만 보내요 (나와 선생님만 봐요)';

  const list=rd?thread().filter(m=>dayOf(m.at)===selDate):[];
  const otherSeen=tab==='dm'?(isT()?seenOf(room,dmWith).dm||0:tSeen(room,me.id)):0;
  const lastMine=tab==='dm'?list.filter(m=>m.from===me.id).at(-1):null;
  let html=list.map((m,i)=>{ const mine=m.from===me.id, t=m.from==='t', prev=list[i-1];
    const cont=prev&&prev.from===m.from&&m.at-prev.at<5*6e4;
    const read=m===lastMine&&otherSeen>=m.at?'<span class="read">읽음</span>':'';
    return `<div class="msg ${mine?'mine':''} ${t?'t':''} ${cont?'cont':''}"><div class="meta">${read}${mine?'':`<b>${esc(nameOf(m.from))}</b>`}${hm(m.at)}<button class="x" data-del="${tab==='all'?'chat':'dm'}:${m.id}" aria-label="지우기">${ic('i-x')}</button></div><div class="text">${linkify(m.text)}</div></div>` }).join('');
  if(!list.length){
    const others=rd?thread():[];
    const near=others.length?`<br><button class="pill" style="margin-top:10px" data-jump="${dayOf(others.at(-1).at)}">마지막 대화 ${dshort(dayOf(others.at(-1).at))} 보기</button>`:'';
    html=!rd?`<div class="hello">${ic('i-dm')}위에서 학생을 고르세요</div>`
      : tab==='dm'&&!isT()&&!others.length?`<div class="hello">${ic('i-lock')}여기 쓴 글은 선생님만 봐요<br>궁금한 것을 편하게 보내세요</div>`
      : `<div class="hello">${ic('i-bubble')}이날은 대화가 없어요${near}</div>`;
  }
  const el=$('#chat'), key=[room,tab,dmWith,selDate,list.length].join('|'), bottom=el.scrollHeight-el.scrollTop-el.clientHeight<60;
  el.innerHTML=html; if(bottom||key!==lastChatKey) el.scrollTop=1e9; lastChatKey=key;
}

    .sort((a,b)=>(b.un-a.un)||((b.last?.at||0)-(a.last?.at||0)));

const pickedRooms=id=>[...$(id).querySelectorAll('[aria-pressed=true]')].map(b=>b.dataset.r);
function openNotice(n){
  editN=n||null; $('#nHead').textContent=n?'공지 고치기':'공지 쓰기'; $('#nSave').textContent=n?'고치기':'붙이기';
  $('#nTitle').value=n?.title||''; $('#nBody').value=n?.body||''; $('#nLinks').innerHTML='';
  (n?.links?.length?n.links:[{}]).forEach(l=>{ linkRow(); const r=$('#nLinks').lastElementChild; r.querySelector('.ln').value=l.name||''; r.querySelector('.lu').value=l.url||'' });
  nColor=n?.c||'violet'; nPin=!!n?.pin; paint(); $('#nPin').setAttribute('aria-pressed',nPin);
  roomPick($('#nRooms'),!n); $('#noticeDlg').showModal(); $('#nTitle').focus();
}
$('#addNotice').onclick=()=>openNotice();
$('#nSave').onclick=()=>{
  const title=$('#nTitle').value.trim(); if(!title){ $('#nTitle').focus(); return }
  const links=[...$('#nLinks').children].map(r=>({name:r.querySelector('.ln').value.trim(),url:safeUrl(r.querySelector('.lu').value.trim())})).filter(l=>l.url);
  const body=$('#nBody').value.trim(), f={title,body,c:nColor,pin:nPin,links};
  if(editN){ store.patch(room,'notices',editN.id,f); $('#noticeDlg').close(); status('공지를 고쳤어요'); return }
  const rs=pickedRooms('#nRooms');
  rs.forEach(r=>store.add(r,'notices',{...f,at:NOW}));
  $('#noticeDlg').close(); status(`${rs.map(r=>ROOMS[r].name).join('·')}에 공지를 붙였어요`);
};

/* ---------- 선생님: 일정 ---------- */
function openEvent(ev){
  editE=ev||null; $('#eHead').textContent=editE?'일정 고치기':'일정 더하기'; $('#eSave').textContent=editE?'고치기':'더하기';
  $('#eWhat').value=editE?.what||''; $('#eTime').value=editE?.time||''; $('#ePlace').value=editE?.place||''; $('#eMemo').value=editE?.memo||'';
  $('#eDate').value=editE?.date||selDate; roomPick($('#eRooms'),!editE); $('#eventDlg').showModal(); $('#eWhat').focus();
}
$('#addEvent').onclick=()=>openEvent();
$('#eSave').onclick=()=>{
  const what=$('#eWhat').value.trim(), date=$('#eDate').value; if(!what||!date){ $('#eWhat').focus(); return }
  const f={what,date,time:$('#eTime').value,place:$('#ePlace').value.trim(),memo:$('#eMemo').value.trim()};
  if(editE){ store.patch(room,'events',editE.id,f); $('#eventDlg').close(); goDate(date); status('일정을 고쳤어요'); return }
  const rs=pickedRooms('#eRooms');
  rs.forEach(r=>store.add(r,'events',f));
  $('#eventDlg').close(); goDate(date); status(`${rs.map(r=>ROOMS[r].name).join('·')} 달력에 더했어요`);
};

/* ---------- 선생님: 학생 번호 ---------- */
// 번호는 sc-admin/roster(선생님만 읽음)에, 서버 확인용으로는 해시만 sc-members 에 둔다
$('#rosterBtn').onclick=()=>{ $('#rosterTitle').textContent=`${ROOMS[room].name} 번호`; drawRoster(); $('#rosterDlg').showModal() };
function drawRoster(){
  const list=roster.filter(p=>p.room===room||p.role==='teacher');
  $('#roster').innerHTML=list.length?list.map(p=>`<div class="r"><input class="nm" data-name="${p.id}" value="${esc(p.name)}" ${p.role==='teacher'?'disabled':''} aria-label="이름"><span class="cd">${p.code}</span><button data-renew="${p.id}">새 번호</button></div>`).join(''):'<p class="empty">번호 목록을 불러오는 중이에요</p>';
}
async function saveRoster(next,ops){
  if(DEMO){ roster=next; return }
  const {f,fs}=fb, b=f.writeBatch(fs);
  ops(b,f,fs); b.update(f.doc(fs,'sc-admin','roster'),{people:next});
  await b.commit(); roster=next;
}
$('#roster').onclick=async e=>{
  const b=e.target.closest('[data-renew]'); if(!b) return;
  const p=roster.find(x=>x.id===b.dataset.renew); if(!p) return;
  if(!confirm(p.role==='teacher'?'선생님 번호를 바꾸면 지금 화면에서 나가게 돼요. 바꿀까요?':`${p.name} 번호를 새로 만들까요? 이전 번호는 바로 못 쓰게 돼요.`)) return;
  const code=newCode(new Set(roster.map(x=>x.code))), [oldKey,newKey]=await Promise.all([sha(SALT+p.code),sha(SALT+code)]);
  const next=roster.map(x=>x.id===p.id?{...x,code}:x);
  try{ await saveRoster(next,(bt,f,fs)=>{ bt.set(f.doc(fs,'sc-members',newKey),{id:p.id,name:p.name,room:p.room,role:p.role}); bt.delete(f.doc(fs,'sc-members',oldKey)) });
    drawRoster(); status(`${p.name} 새 번호를 만들었어요. 「쪽지 인쇄」로 다시 뽑을 수 있어요`); if(p.role==='teacher'&&!DEMO) logout() }catch(err){ failed(err) }
};
$('#roster').onchange=async e=>{
  const i=e.target.closest('[data-name]'); if(!i) return;
  const name=i.value.trim().slice(0,20), p=roster.find(x=>x.id===i.dataset.name); if(!p||!name||name===p.name){ if(p) i.value=p.name; return }
  const next=roster.map(x=>x.id===p.id?{...x,name}:x), key=await sha(SALT+p.code);
  const people=next.filter(x=>x.room===p.room).map(({id,name,role})=>({id,name,role}));
  try{ await saveRoster(next,(bt,f,fs)=>{ bt.update(f.doc(fs,'sc-members',key),{name}); bt.set(f.doc(fs,'sc-directory',p.room),{people}) });
    if(DEMO) dir[p.room]=people; status('이름을 바꿨어요') }catch(err){ failed(err) }
};
$('#printSlips').onclick=()=>{
  const list=roster.filter(p=>p.room===room);
  const w=window.open('','_blank'); if(!w){ status('팝업이 막혔어요. 팝업을 허용해 주세요',true); return }
  w.document.write(slipsHtml(list,ROOMS[room].name)); w.document.close(); setTimeout(()=>w.print(),400);
};
function slipsHtml(list,title){
  const card=p=>`<div class="slip"><div class="top"><b>sc 소통 창구</b><span>${esc(title)}</span></div><div class="who">${esc(p.name)}</div><div class="code">${p.code}</div><div class="foot">${SITE} · 번호는 나만 알고 있기</div></div>`;
  return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${esc(title)} 번호 쪽지</title><style>
  @page{size:A4;margin:10mm}body{margin:0;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#111}
  .grid{display:grid;grid-template-columns:repeat(3,1fr)}.slip{border:1px dashed #999;padding:4mm 5mm;height:32mm;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;break-inside:avoid}
  .top{display:flex;justify-content:space-between;font-size:9pt;color:#555}.who{font-size:12pt;font-weight:700}.code{font-size:22pt;font-weight:800;letter-spacing:.12em;font-variant-numeric:tabular-nums}.foot{font-size:7.5pt;color:#666}
  </style></head><body><div class="grid">${list.map(card).join('')}</div></body></html>`;
}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());

function renderAll(){ renderHead(); renderNotices(); renderCal(); renderDay(); renderTodos(); renderPolls(); renderTalk() }

/* ---------- 시계 · 자동 나가기 ---------- */
const tick=()=>{ const d=new Date(); $('#clock').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 (${W[d.getDay()]}) ${hm(d)}` };
tick();
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{ lastTouch=Date.now(); if($('#status').classList.contains('warn')) $('#status').classList.remove('visible') }));
setInterval(()=>{
  tick();
  if(!me && lockedUntil>Date.now() && $('#login').classList.contains('on')) lockMsg(`잠시 뒤에 다시 눌러 주세요 (${Math.ceil((lockedUntil-Date.now())/1000)}초)`,true);
  else if(!me && lockedUntil && lockedUntil<=Date.now()){ lockedUntil=0; lockMsg('&nbsp;') }
  if(!me) return;
  const left=IDLE_MIN*60-Math.round((Date.now()-lastTouch)/1000);
  if(left<=0){ logout(); status('오래 비어 있어서 나갔어요'); return }
  if(left===60) status(`${me.name}, 1분 뒤 저절로 나가요. 화면을 누르면 계속 쓸 수 있어요`,true);
  if(left%60===0) schedule();
},1000);
if(!DEMO) sdk().catch(e=>console.warn(e));   // 첫 번호 확인을 빠르게
</script>
