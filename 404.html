<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      // /upload/<주소 이름> 은 파일 수합 제출 화면으로 보여 준다(주소는 그대로 둠).
      (function () {
        if (!/^\/upload\/[^/]+\/?$/.test(location.pathname)) return;
        document.documentElement.style.visibility = 'hidden';
        fetch('/upload/app.html', { cache: 'no-cache' })
          .then(function (r) { if (!r.ok) throw 0; return r.text(); })
          .then(function (t) { document.open(); document.write(t); document.close(); })
          .catch(function () { document.documentElement.style.visibility = ''; });
      })();
    </script>

    <title>페이지를 찾을 수 없어요 · 게으른 교사의 작업실</title>
    <link rel="icon" href="/assets/about/favicon-32.png" type="image/png" sizes="32x32">
    <meta name="robots" content="noindex">
    <style>
      :root{--ink:#182433;--muted:#526478;--line:#dce3eb;--bg:#f6f8fa;--card:#fff;--blue:#0869df}
      @media (prefers-color-scheme:dark){:root{--ink:#e7ecf2;--muted:#9aa7b4;--line:#2a333d;--bg:#11161c;--card:#19212a;--blue:#5aa2ff}}
      *{box-sizing:border-box}
      html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif}
      main{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:32px 16px}
      .card{width:100%;max-width:420px;text-align:center}
      .card img{width:96px;height:96px;display:block;margin:0 auto 20px}
      h1{font-size:24px;margin:0 0 8px;letter-spacing:-.01em}
      p{margin:0 0 24px;color:var(--muted)}
      .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
      a.btn{display:inline-block;padding:11px 20px;border-radius:999px;text-decoration:none;font-weight:600}
      a.primary{background:var(--blue);color:#fff}
      a.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}
      code{font-size:13px;color:var(--muted);word-break:break-all}
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <img src="/assets/about/hammer-alpha-192.webp" width="96" height="96" alt="">
        <h1>페이지를 찾을 수 없어요</h1>
        <p>주소가 바뀌었거나 없어진 페이지입니다.<br><code id="missing-path"></code></p>
        <div class="actions">
          <a class="btn primary" href="/">작업실로 가기</a>
          <a class="btn secondary" href="/docfinder/">DocFinder 문서함</a>
        </div>
      </div>
    </main>
    <script>document.getElementById('missing-path').textContent=location.pathname;</script>
  </body>
</html>
