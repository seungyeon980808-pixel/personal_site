<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>맑은 물과 바위 · 작업실 시안 10가지</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#182530;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}main{max-width:1540px;margin:auto;padding:40px 28px}h1{font-size:32px;letter-spacing:-.035em;margin:8px 0 12px}header p{line-height:1.7;color:#566777;max-width:820px}a{color:#1769bc}small{font-size:13px;color:#657787}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}nav a{display:grid;place-items:center;min-width:40px;height:40px;border:1px solid #d5dfe7;border-radius:12px;background:white;text-decoration:none;font-weight:600}nav a:hover{border-color:#1769bc;background:#e8f2ff}section{display:grid;grid-template-columns:1fr 1fr;gap:24px}article{background:white;border-radius:18px;overflow:hidden;border:1px solid #dbe3ea;scroll-margin-top:20px}.preview{display:block;width:100%;padding:0;border:0;background:#dae3eb;cursor:zoom-in}.preview img{display:block;width:100%;aspect-ratio:8/5;object-fit:contain}article .copy{padding:18px 20px}h2{font-size:19px;margin:0 0 8px;display:flex;align-items:center;gap:10px}h2 span{font-size:11px;border-radius:20px;padding:4px 7px;background:#e9f3ff;color:#1963a9;font-weight:600}article p{font-size:14px;color:#526271;line-height:1.65;margin:0 0 12px}article a{font-size:13px}footer{margin-top:28px;color:#657787;line-height:1.7;font-size:14px}dialog{border:0;border-radius:18px;padding:0;background:#17212b;color:white;width:min(1540px,96vw);max-width:96vw;max-height:95dvh}dialog::backdrop{background:#08131fe6}dialog img{display:block;width:100%;max-height:calc(95dvh - 64px);object-fit:contain}dialog header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:12px;min-height:60px}dialog h2{margin:0;font-size:16px}dialog button{background:#ffffff18;border:1px solid #ffffff30;color:white;padding:8px 12px;border-radius:9px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #1485ff;outline-offset:3px}#controls{display:flex;gap:8px}@media(max-width:700px){main{padding:24px 14px}section{grid-template-columns:1fr;gap:18px}h1{font-size:26px}dialog header{flex-wrap:wrap}dialog{max-width:98vw;width:98vw}.copy{padding:16px}}
</style>
<main><header><small>게으른 교사의 작업실 · 배경 비교</small><h1>맑은 물과 바위, 작업실 시안 10가지</h1><p>첨부하신 배경의 청록색 물과 바위, 파란 하늘을 기준으로 골랐습니다. 타호 호수 6장과 지중해 해안 4장을 같은 작업실 배치에 올렸습니다. 사진을 누르면 크게 비교할 수 있습니다.</p><small>현재 작업실에는 아직 적용하지 않았습니다. 시안은 사진 원래 밝기로 비교했습니다. · <a href="https://unsplash.com/license" target="_blank" rel="noopener">무료 사용 조건 ↗</a></small></header><nav aria-label="후보로 이동"></nav><section id="candidates"></section><footer>사진별 원본 페이지에서 Unsplash License를 확인했습니다. 선택 후 화면 비율과 밝기를 최종 조정합니다.</footer></main>
<dialog aria-labelledby="large-title"><header><h2 id="large-title"></h2><div id="controls"><button id="previous" aria-label="이전 시안">←</button><button id="next" aria-label="다음 시안">→</button><button id="close">닫기</button></div></header><img id="large-image" alt=""></dialog>
<script>
(async()=>{const photos=await(await fetch('./coastal-previews/photos.json')).json(),dialog=document.querySelector('dialog');let selected=0;
function show(index){selected=(index+photos.length)%photos.length;const p=photos[selected];document.querySelector('#large-title').textContent=`${p.id}. ${p.name}`;document.querySelector('#large-image').src=`./coastal-previews/${p.id}.jpg`;document.querySelector('#large-image').alt=`${p.name} 배경을 적용한 실제 작업실 시안`;if(!dialog.open)dialog.showModal()}
photos.forEach((p,index)=>{const card=document.createElement('article');card.id=p.id;card.innerHTML=`<button class="preview" aria-label="${p.id}. ${p.name} 시안 크게 보기"><img src="./coastal-previews/${p.id}.jpg" alt="${p.name} 배경의 작업실" loading="${index<2?'eager':'lazy'}"></button><div class="copy"><h2>${p.id}. ${p.name}</h2><p>${p.note}</p><a href="https://unsplash.com/photos/${p.source}" target="_blank" rel="noopener">사진 ${p.author} · 원본과 라이선스 ↗</a></div>`;card.querySelector('button').onclick=()=>show(index);document.querySelector('#candidates').append(card);const link=document.createElement('a');link.href='#'+p.id;link.textContent=p.id;link.setAttribute('aria-label',p.name+' 시안으로 이동');document.querySelector('nav').append(link)});
document.querySelector('#close').onclick=()=>dialog.close();document.querySelector('#previous').onclick=()=>show(selected-1);document.querySelector('#next').onclick=()=>show(selected+1);dialog.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();show(selected-1)}if(e.key==='ArrowRight'){e.preventDefault();show(selected+1)}});
})()
</script></html>
