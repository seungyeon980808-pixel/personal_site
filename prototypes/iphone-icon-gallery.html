<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="같은 모바일 작업실에 적용한 다섯 가지 아이콘 디자인 시안"><title>모바일 아이콘 · 다섯 가지 시안</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef0f2;color:#20272e;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}header{max-width:1320px;margin:auto;padding:56px 24px 32px}header small{font-size:12px;letter-spacing:.15em;color:#687681}h1{font-size:36px;letter-spacing:-.055em;margin:12px 0}header p{color:#5b6771;line-height:1.7;font-size:15px;word-break:keep-all}.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}a{color:inherit;text-decoration:none}.links a{background:#fff;padding:12px 16px;border-radius:24px;font-size:14px}a:focus-visible{outline:3px solid #0869df;outline-offset:4px}main{max-width:1320px;margin:auto;padding:0 24px 64px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 28px}article{min-width:0;scroll-margin-top:24px}.description{min-height:112px}h2{font-size:22px;margin:0 0 10px;letter-spacing:-.04em}h2 span{font-size:13px;color:#7b8790;margin-right:8px}article p{font-size:14px;color:#5b6771;line-height:1.65;margin:0 0 14px;word-break:keep-all}.open{font-size:13px;color:#0869df;display:inline-block;padding:4px 0 14px}.preview{height:844px;max-width:390px;margin:auto;border-radius:32px;overflow:hidden;box-shadow:0 12px 32px #2030401a;border:1px solid #ffffff}iframe{width:100%;height:100%;border:0;display:block;background:#9dc5d8}@media(max-width:1100px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:720px){header{padding-top:32px}h1{font-size:28px}main{grid-template-columns:1fr;padding:0 16px 40px;gap:40px}.description{min-height:0}.preview{height:820px}article{max-width:390px;width:100%;margin:auto}}
</style></head><body><header><small>ICON STUDIES / 01—05</small><h1>어떤 아이콘이 더 어울리나요?</h1><p>같은 배경과 배치에 다섯 가지 방향을 적용했습니다.<br>각 화면에서 아이콘을 눌러볼 수 있습니다. 실제 배포본은 그대로입니다.</p><nav class="links" aria-label="시안 바로가기"><a href="#ios">01 기본 iOS</a><a href="#glass">02 클리어 글라스</a><a href="#mono">03 모노 스튜디오</a><a href="#object">04 미니 오브젝트</a><a href="#color">05 컬러 블록</a></nav></header><main id="gallery"></main><script>
const variants=[['ios','기본 iOS','익숙한 채움형 심벌과 선명한 앱 컬러. 가장 자연스러운 홈 화면.'],['glass','클리어 글라스','바다색이 비치는 유리 표면과 빛나는 심벌. 가볍고 투명한 인상.'],['mono','모노 스튜디오','아이보리와 차콜의 대비. 색을 덜어낸 차분한 작업실.'],['object','미니 오브젝트','틀을 벗어난 폴더와 노트, 작은 사물들. 실물처럼 구분되는 형태.'],['color','컬러 블록','대담한 색면과 기하학적인 그림. 개성이 뚜렷한 그래픽 스타일.']];
document.querySelector('#gallery').innerHTML=variants.map(([id,name,description],index)=>`<article id="${id}"><div class="description"><h2><span>0${index+1}</span>${name}</h2><p>${description}</p><a class="open" href="iphone-workspace.html?iconStyle=${id}" target="_blank" rel="noopener">이 시안 크게 보기 ↗</a></div><div class="preview"><iframe loading="lazy" src="iphone-workspace.html?iconStyle=${id}" title="${index+1}번 ${name} 모바일 시안"></iframe></div></article>`).join('');
</script></body></html>
