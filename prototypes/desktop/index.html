<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>박승연의 작업실 · 인터랙티브 시안</title><link rel="stylesheet" href="style.css"></head><body>
<section id="entrance" aria-label="교실 입구"><img src="assets/classroom.png" alt="분필 글씨가 적힌 칠판 앞 책상, 맥북과 시험지, 휴대폰"><button id="enter">작업실 들어가기 <span>↗</span></button><small>인터랙티브 프로토타입 · 화면 속 맥북을 눌러보세요</small></section>
<main id="desktop" hidden><header><strong>박승연의 작업실</strong><span class="prototype">인터랙티브 시안</span><nav><button id="edit">편집 체험</button><button id="return">책상으로 돌아가기 ↗</button></nav></header><aside id="widgets"><section class="widget"><div class="month"><button id="prev" aria-label="이전 달">‹</button><strong id="month"></strong><button id="next" aria-label="다음 달">›</button></div><div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="dates"></div><p class="hint">● 기록이 있는 날을 눌러보세요</p><button class="text" id="allRecords">전체 기록 보기 ↗</button></section><section class="widget note"><div class="note-head"><strong>메모</strong><span>방문자에게</span></div><p id="noteText"></p><button class="text" data-open="training">연수 자료 열기 ↗</button><button id="editNote" hidden>메모 수정</button></section></aside><section id="icons" aria-label="바탕화면 바로가기"></section><footer><a href="https://www.pexels.com/photo/turquoise-lake-water-surrounded-by-mountains-7191677/" target="_blank" rel="noopener">Photo: Richard Low Hong / Pexels</a><span id="saveState"></span></footer><nav id="dock" aria-label="프로그램 Dock"></nav></main>
<dialog id="window"><div class="titlebar"><button id="close" aria-label="창 닫기" class="traffic red"></button><button id="expand" aria-label="창 크기 전환" class="traffic green"></button><strong id="windowTitle"></strong><span>작업실</span></div><div id="windowBody"></div></dialog><script src="app.js"></script></body></html>
