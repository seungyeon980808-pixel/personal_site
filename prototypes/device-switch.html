<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기기 전환 · 기존 작업실</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:white} .device{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;transition:transform 950ms cubic-bezier(.22,.8,.18,1);background:transparent}.device iframe{width:100%;height:100%;border:0;display:block}.switch{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;cursor:pointer}.switch:focus-visible{outline:3px solid #0071e3;outline-offset:-5px}.device.active .switch{display:none}@media(prefers-reduced-motion:reduce){.device{transition:none}}
</style><body><section class="device active" id="desktop"><iframe src="../?entrance=closed" title="데스크톱 작업실"></iframe><button class="switch" aria-label="맥북으로 전환" title="맥북으로 전환"></button></section><section class="device" id="mobile"><iframe src="../?v=phone&entrance=closed" title="모바일 작업실"></iframe><button class="switch" aria-label="휴대폰으로 전환" title="휴대폰으로 전환"></button></section><script>
const panels=[...document.querySelectorAll('.device')];let active='desktop',busy=false;
function size(p){const mobile=p.id==='mobile',w=mobile?390:Math.max(900,innerWidth),s=mobile?Math.min(1,innerHeight/844):Math.min(1,innerWidth/w);return {w,h:mobile?844:innerHeight/s,s}}
function bounds(p){const d=p.querySelector('iframe').contentDocument;const entrance=d?.querySelector('#entrance');const w=parseFloat(entrance?.style.getPropertyValue('--rest-width'))||300,h=parseFloat(entrance?.style.getPropertyValue('--rest-height'))||150,top=parseFloat(entrance?.style.getPropertyValue('--rest-top'))||350;return {w,h,top}}
function layout(){for(const p of panels){const z=size(p),b=bounds(p),isActive=p.id===active;p.style.width=z.w+'px';p.style.height=z.h+'px';p.classList.toggle('active',isActive);p.style.zIndex=isActive?'1':'3';const doc=p.querySelector('iframe').contentDocument;doc?.documentElement.classList.toggle('switch-mini',!isActive);if(isActive){p.style.clipPath='none';p.style.transform=`translate(${(innerWidth-z.w*z.s)/2}px,0px) scale(${z.s})`}else{const s=p.id==='mobile'?.43:.85;const x=(p.id==='desktop'?innerWidth-Math.min(260,innerWidth*.30):innerWidth-b.w*s*.58)-(z.w-b.w)/2*s,y=p.id==='desktop'?innerHeight*.80-(b.top+b.h/2)*s:innerHeight-45-(b.top+b.h)*s;p.style.clipPath=`inset(${Math.max(0,b.top-15)}px ${Math.max(0,(z.w-b.w)/2-20)}px ${Math.max(0,z.h-b.top-b.h-30)}px ${Math.max(0,(z.w-b.w)/2-20)}px)`;p.style.transform=`translate(${x}px,${y}px) scale(${s})`}}}
function peek(p,on){p.querySelector('iframe').contentDocument?.documentElement.classList.remove('device-peek-hover')}
function change(id){if(busy||id===active)return;busy=true;for(const p of panels)if(p.id!==id)peek(p,false);active=id;layout();const copy=document.querySelector('#'+id+' iframe').contentDocument?.querySelector('.entrance-copy');if(copy&&!matchMedia('(prefers-reduced-motion:reduce)').matches)copy.animate([{opacity:0,transform:'translateX(100px)'},{opacity:1,transform:'translateX(0)'}],{duration:850,easing:'cubic-bezier(.16,1,.3,1)'});setTimeout(()=>{busy=false;peek(document.querySelector('#'+id),false)},960)}
for(const p of panels){const button=p.querySelector('button');button.onclick=()=>{peek(p,true);change(p.id)};p.addEventListener('pointerenter',()=>{if(!p.classList.contains('active'))peek(p,true)});p.addEventListener('pointerleave',()=>{if(!p.classList.contains('active'))peek(p,false)});p.addEventListener('focusin',()=>{if(!p.classList.contains('active'))peek(p,true)});p.addEventListener('focusout',event=>{if(!p.classList.contains('active')&&!p.contains(event.relatedTarget))peek(p,false)});p.querySelector('iframe').addEventListener('load',()=>{const d=p.querySelector('iframe').contentDocument;const style=d.createElement('style');style.textContent='.switch-mini .entrance-copy{visibility:hidden!important}.switch-mini,.switch-mini body,.switch-mini #entrance{background:transparent!important}.switch-mini body>#desktop{visibility:hidden!important}.switch-mini .device-cover{transform:scaleY(1)!important}.switch-mini .phone-rest-photo .screen-viewport::after{opacity:1!important}';d.head.append(style);if(d.querySelector('#entrance')?.hidden)d.querySelector('#return')?.click();const check=setInterval(()=>{if(d.querySelector('#entrance')?.dataset.ready==='true'){clearInterval(check);layout()}},100);setTimeout(()=>clearInterval(check),10000);layout()})}window.addEventListener('resize',layout);layout();
</script></body></html>
