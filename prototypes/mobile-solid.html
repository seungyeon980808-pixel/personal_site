<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>입체 회전 비교 시안</title><style>*{box-sizing:border-box}body{margin:0;background:#eef0f3;font:14px system-ui;color:#343a43;display:grid;place-items:center;min-height:100dvh;padding:20px;gap:14px}header{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px}a{color:#526373}strong{color:#1d1d1f}label{display:flex;gap:6px;align-items:center;font-size:12px}iframe{display:block;width:390px;height:min(844px,calc(100dvh - 100px));max-width:100%;border:0;border-radius:20px;box-shadow:0 12px 50px #16233118;background:white}@media(max-width:440px){body{padding:10px 0;gap:10px}iframe{width:100vw;height:calc(100dvh - 72px);border-radius:0}}</style><header><a href="mobile-phone.html">기존 시안</a><strong>입체 회전 시안</strong><label><input type="checkbox" id="slow">천천히 보기</label></header><iframe src="../?entrance=solid" title="입체 휴대폰 작업실"></iframe><script>document.querySelector('#slow').onchange=event=>document.querySelector('iframe').contentWindow.postMessage({type:'solid-speed',slow:event.target.checked},location.origin);</script></html>
