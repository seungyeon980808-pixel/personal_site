<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>노치 움직임 비교</title><style>body{margin:0;font-family:system-ui}nav{height:48px;display:flex;align-items:center;justify-content:center;gap:12px;background:#f3f6f9}button{padding:7px 16px;border:1px solid #c7d5e0;border-radius:20px;background:white}button[aria-pressed=true]{background:#0879ee;color:white}iframe{width:100%;height:calc(100dvh - 48px);border:0}</style><nav><button data-mode="calm">A · 느긋한 움직임</button><button data-mode="active">B · 활발한 움직임</button></nav><iframe title="노치 시안"></iframe><script>const f=document.querySelector('iframe');function set(mode){document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));f.src='../?entrance=closed&welcome=1&notchMotion='+mode}document.querySelectorAll('button').forEach(b=>b.onclick=()=>set(b.dataset.mode));f.onload=()=>f.contentDocument.querySelector('#enter').click();set('active');</script></html>
