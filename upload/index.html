<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파일 수합 관리 · 대왕중학교</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#f3f4f7; --card:#ffffff; --text:#14161c; --muted:#6b7080; --faint:#9aa0ad;
    --line:#e4e6ec; --field:#f7f8fa; --accent:#2b44c9; --accent-hover:#2238ad; --accent-soft:#eef1fd;
    --ok:#12805c; --ok-soft:#e7f6ef; --err:#c9302c; --err-soft:#fdeeee; --gray-soft:#eceef2;
    --shadow:0 1px 2px rgba(20,22,28,.04),0 8px 28px rgba(20,22,28,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1115; --card:#171a21; --text:#eceef3; --muted:#9aa0ad; --faint:#6b7080;
      --line:#2a2e38; --field:#1d2029; --accent:#7189ff; --accent-hover:#8a9dff; --accent-soft:#1f2540;
      --ok:#4cc79a; --ok-soft:#15302a; --err:#ff7a74; --err-soft:#3a1d1d; --gray-soft:#242832;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;letter-spacing:-.01em;word-break:keep-all;min-height:100vh;padding:40px 16px 40px}
  .wrap{width:100%;max-width:720px;margin:0 auto}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
  .badge{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
  .badge i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  h1{font-size:25px;line-height:1.3;font-weight:700;margin:0;letter-spacing:-.025em}
  .who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);white-space:nowrap}
  .who b{font-weight:600;color:var(--text)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:28px}
  .card + .card,.card + .section{margin-top:20px}
  h2{font-size:17px;font-weight:700;margin:0 0 18px;letter-spacing:-.02em}
  .lead{font-size:14.5px;line-height:1.6;color:var(--muted);margin:0 0 22px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 16px}
  .full{grid-column:1/-1}
  label.f{display:block}
  label.f span{display:block;font-size:13.5px;font-weight:600;margin-bottom:8px}
  label.f small{display:block;font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.5;word-break:break-all}
  label.f small b{color:var(--accent);font-weight:600}
  input[type=text]{width:100%;height:46px;padding:0 14px;font:inherit;font-size:15px;color:var(--text);background:var(--field);
    border:1px solid var(--line);border-radius:11px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
  input[type=text]::placeholder{color:var(--faint)}
  input[type=text]:focus{border-color:var(--accent);background:var(--card);box-shadow:0 0 0 4px var(--accent-soft)}
  .pre{display:flex;align-items:center;height:46px;background:var(--field);border:1px solid var(--line);border-radius:11px;transition:border-color .15s,box-shadow .15s,background .15s}
  .pre:focus-within{border-color:var(--accent);background:var(--card);box-shadow:0 0 0 4px var(--accent-soft)}
  .pre em{font-style:normal;font-size:14px;color:var(--faint);padding-left:14px;white-space:nowrap}
  .pre input{border:0!important;box-shadow:none!important;background:transparent!important;padding-left:2px;height:44px}

  .btn{height:46px;padding:0 20px;border:0;border-radius:11px;background:var(--accent);color:#fff;font:inherit;font-size:15px;font-weight:600;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,opacity .15s;white-space:nowrap;text-decoration:none}
  .btn:hover:not(:disabled){background:var(--accent-hover)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.block{width:100%;height:50px;font-size:16px}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .btn.ghost:hover:not(:disabled){background:var(--field)}
  .btn.small{height:34px;padding:0 12px;font-size:13px;border-radius:9px;font-weight:500}
  .btn.link{height:auto;padding:0;background:none;border:0;color:var(--muted);font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
  .btn.link:hover{color:var(--text);background:none}
  .btn svg{width:16px;height:16px}
  .actions{display:flex;justify-content:flex-end;margin-top:20px}
  .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:r .7s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}

  .msg{font-size:13.5px;line-height:1.5;border-radius:10px;margin-top:16px;padding:10px 12px}
  .msg.err{background:var(--err-soft);color:var(--err)}
  .msg.ok{background:var(--ok-soft);color:var(--ok)}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:32px 4px 12px}
  .section-head h2{margin:0}
  .section-head span{font-size:13px;color:var(--muted)}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center}
  .item.closed{background:var(--field)}
  .item-title{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:600;min-width:0}
  .item-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{flex:none;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
  .pill.off{background:var(--gray-soft);color:var(--muted)}
  .item-url{font-size:13px;color:var(--accent);word-break:break-all}
  .item-meta{font-size:12.5px;color:var(--muted)}
  .item-btns{grid-row:1/4;grid-column:2;display:flex;flex-direction:column;gap:6px;align-items:stretch}
  .empty{padding:28px;text-align:center;font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:16px}

  .gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;height:52px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--text);font:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:background .15s}
  .gbtn:hover{background:var(--field)}
  .gbtn svg{width:20px;height:20px}
  .center{max-width:440px;margin:60px auto 0}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--text);color:var(--bg);
    font-size:14px;font-weight:500;padding:12px 18px;border-radius:12px;transition:opacity .2s,transform .2s;pointer-events:none;z-index:9}
  .toast.on{opacity:1;transform:translateX(-50%)}
  footer{margin-top:28px;text-align:center;font-size:12px;color:var(--faint)}
  [hidden]{display:none!important}
  @media (max-width:600px){
    body{padding-top:24px}
    .top{flex-direction:column;align-items:flex-start}
    .card{padding:22px 18px;border-radius:18px}
    .grid{grid-template-columns:1fr}
    .item{grid-template-columns:1fr}
    .item-btns{grid-row:auto;grid-column:auto;flex-direction:row;flex-wrap:wrap;margin-top:8px}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 로그인 전 -->
  <section id="loginView" class="center" hidden>
    <div class="card">
      <div class="badge"><i></i><span>대왕중학교</span></div>
      <h1 style="margin-bottom:8px">파일 수합 관리</h1>
      <p class="lead">자료 요청 링크를 만들고 관리합니다. 허용된 구글 계정으로 로그인해 주세요.</p>
      <button class="gbtn" id="loginBtn" type="button">
        <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Google로 로그인
      </button>
      <div class="msg err" id="loginMsg" hidden></div>
    </div>
  </section>

  <!-- 로그인 후 -->
  <section id="adminView" hidden>
    <div class="top">
      <div>
        <div class="badge"><i></i><span>대왕중학교</span></div>
        <h1>파일 수합 관리</h1>
      </div>
      <div class="who"><b id="whoEmail"></b><button class="btn link" id="logoutBtn" type="button">로그아웃</button></div>
    </div>

    <div class="card">
      <h2>새 수합 만들기</h2>
      <div class="grid">
        <label class="f full">
          <span>제목</span>
          <input type="text" id="fTitle" maxlength="60" placeholder="예: 학교폭력 유공교원 가산점 서류 제출">
        </label>
        <label class="f">
          <span>주소 이름</span>
          <div class="pre"><em>psy.ai.kr/upload/</em><input type="text" id="fSlug" maxlength="30" placeholder="유공교원"></div>
          <small>한글·영문·숫자로 짧게</small>
        </label>
        <label class="f">
          <span>파일 이름 앞부분</span>
          <input type="text" id="fPrefix" maxlength="60" placeholder="대왕중_유공교원_">
          <small id="fPrefixEx"></small>
        </label>
        <label class="f full">
          <span>받는 폴더 <em style="font-style:normal;font-weight:400;color:var(--muted)">(선택)</em></span>
          <input type="text" id="fFolder" placeholder="드라이브 폴더 링크를 붙여 넣으세요">
          <small>비워 두면 내 드라이브 「파일 수합」 폴더 안에 제목 이름으로 새 폴더를 만듭니다. 폴더 안에는 다시 낸 파일을 모으는 「휴지통」 폴더가 생깁니다.</small>
        </label>
      </div>
      <div class="msg" id="createMsg" hidden></div>
      <div class="actions"><button class="btn" id="createBtn" type="button">만들기</button></div>
    </div>

    <div class="section-head"><h2>수합 목록</h2><span id="listInfo"></span></div>
    <div class="list" id="list"><div class="empty">불러오는 중…</div></div>
  </section>

  <footer>대왕중학교 · 파일 수합</footer>
</div>
<div class="toast" id="toast"></div>

<script type="module">
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwMiLPL0gNKkceci2-VGnZC0_qb-DsgBggZ1_JDl97l0s6_6lFEc7KmwQONDV8SUbzF/exec';
const SDK = 'https://www.gstatic.com/firebasejs/12.14.0/';
const firebaseConfig = { apiKey: 'AIzaSyAbHRNi10RttJNoLJCuxZQHucwp5Vttn90', authDomain: 'edunote-96bd7.firebaseapp.com', projectId: 'edunote-96bd7' };
const BASE = 'https://www.psy.ai.kr/upload/';
const $ = id => document.getElementById(id);

const [{ initializeApp }, A] = await Promise.all([import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js')]);
const auth = A.getAuth(initializeApp(firebaseConfig, 'upload-admin'));

async function api(req) {
  const res = await fetch(ENDPOINT, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(req), credentials: 'omit', redirect: 'follow'
  }).catch(() => { throw new Error('인터넷 연결을 확인해 주세요.'); });
  const out = await res.json().catch(() => ({ ok: false, error: '서버 응답을 읽지 못했습니다.' }));
  if (!out.ok) throw new Error(out.error || '실패했습니다.');
  return out;
}
async function adminApi(req) {
  const u = auth.currentUser;
  if (!u) throw new Error('로그인이 필요합니다.');
  return api(Object.assign({ idToken: await u.getIdToken() }, req));
}

function toast(t) {
  const el = $('toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2200);
}
function setMsg(el, t, kind) { el.hidden = !t; el.textContent = t || ''; el.className = 'msg ' + (kind || 'err'); }
const cleanPart = s => s.replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, '');
const slugOf = s => s.trim().replace(/\s+/g, '-');
const urlOf = slug => BASE + slug;

async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select();
    const ok = document.execCommand('copy'); t.remove(); return ok;
  }
}

// ───── 로그인 ─────
$('loginBtn').onclick = async () => {
  setMsg($('loginMsg'), '');
  try { await A.signInWithPopup(auth, new A.GoogleAuthProvider()); }
  catch (e) { if (e.code !== 'auth/popup-closed-by-user') setMsg($('loginMsg'), '로그인하지 못했습니다. 팝업 차단을 풀고 다시 눌러 주세요.'); }
};
$('logoutBtn').onclick = () => A.signOut(auth);

A.onAuthStateChanged(auth, async user => {
  if (!user) { $('adminView').hidden = true; $('loginView').hidden = false; return; }
  try {
    const { email } = await adminApi({ action: 'me' });
    $('whoEmail').textContent = email;
    $('loginView').hidden = true; $('adminView').hidden = false;
    loadList();
  } catch (e) {
    await A.signOut(auth);
    setMsg($('loginMsg'), e.message);
  }
});

// ───── 새 수합 ─────
let prefixTouched = false;
function syncPrefix() {
  const slug = slugOf($('fSlug').value);
  if (!prefixTouched) $('fPrefix').value = slug ? '대왕중_' + slug + '_' : '';
  const p = cleanPart($('fPrefix').value) || '대왕중_' + (slug || '주소이름') + '_';
  $('fPrefixEx').innerHTML = '';
  $('fPrefixEx').append('저장 예: ', Object.assign(document.createElement('b'), { textContent: p + '홍길동.pdf' }));
}
$('fSlug').addEventListener('input', syncPrefix);
$('fPrefix').addEventListener('input', () => { prefixTouched = !!$('fPrefix').value; syncPrefix(); });
syncPrefix();

$('createBtn').onclick = async () => {
  const btn = $('createBtn'), msg = $('createMsg');
  const req = { action: 'create', title: $('fTitle').value.trim(), slug: slugOf($('fSlug').value),
    prefix: cleanPart($('fPrefix').value), folder: $('fFolder').value.trim() };
  if (!req.title) return setMsg(msg, '제목을 적어 주세요.');
  if (!req.slug) return setMsg(msg, '주소 이름을 적어 주세요.');
  btn.disabled = true; btn.innerHTML = '<div class="spin"></div>만드는 중'; setMsg(msg, '');
  try {
    const { item } = await adminApi(req);
    const copied = await copy(urlOf(item.slug));
    setMsg(msg, `만들었습니다. ${urlOf(item.slug)}${copied ? ' — 링크를 복사했습니다.' : ''}`, 'ok');
    ['fTitle', 'fSlug', 'fPrefix', 'fFolder'].forEach(id => $(id).value = '');
    prefixTouched = false; syncPrefix();
    loadList();
  } catch (e) { setMsg(msg, e.message); }
  btn.disabled = false; btn.textContent = '만들기';
};

// ───── 목록 ─────
function fmt(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function button(text, cls, onClick) {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'btn ghost small ' + (cls || '');
  b.textContent = text; b.onclick = onClick; return b;
}
function renderList(items) {
  const list = $('list'); list.innerHTML = '';
  $('listInfo').textContent = items.length ? `${items.length}개 · 받는 중 ${items.filter(i => i.open).length}개` : '';
  if (!items.length) { list.innerHTML = '<div class="empty">아직 만든 수합이 없습니다.</div>'; return; }
  items.forEach(it => {
    const row = document.createElement('div'); row.className = 'item' + (it.open ? '' : ' closed');
    const title = document.createElement('div'); title.className = 'item-title';
    const pill = document.createElement('em'); pill.className = 'pill' + (it.open ? '' : ' off'); pill.style.fontStyle = 'normal';
    pill.textContent = it.open ? '받는 중' : '마감';
    title.append(pill, Object.assign(document.createElement('span'), { textContent: it.title }));
    const url = document.createElement('div'); url.className = 'item-url'; url.textContent = urlOf(it.slug);
    const meta = document.createElement('div'); meta.className = 'item-meta';
    meta.textContent = (it.files < 0 ? '폴더를 열 수 없음' : `제출 파일 ${it.files}개` + (it.last ? ` · 마지막 ${fmt(it.last)}` : '')) + ` · 파일 이름 ${it.prefix}이름`;
    const btns = document.createElement('div'); btns.className = 'item-btns';
    btns.append(
      button('링크 복사', '', async () => toast((await copy(urlOf(it.slug))) ? '링크를 복사했습니다' : '복사하지 못했습니다')),
      Object.assign(document.createElement('a'), { className: 'btn ghost small', href: it.folderUrl, target: '_blank', rel: 'noopener', textContent: '폴더 열기' }),
      button(it.open ? '마감하기' : '다시 열기', '', async e => {
        const b = e.currentTarget; b.disabled = true;
        try { await adminApi({ action: 'setOpen', slug: it.slug, open: !it.open }); toast(it.open ? '마감했습니다' : '다시 열었습니다'); loadList(); }
        catch (err) { toast(err.message); b.disabled = false; }
      })
    );
    row.append(title, url, meta, btns);
    list.append(row);
  });
}
async function loadList() {
  try { renderList((await adminApi({ action: 'list' })).items); }
  catch (e) { $('list').innerHTML = ''; $('list').append(Object.assign(document.createElement('div'), { className: 'empty', textContent: e.message })); }
}
</script>
</body>
</html>
